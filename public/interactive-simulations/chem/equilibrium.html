<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Le Chatelier's Principle</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, THREE } from '../engine/concept.js';
// A + B ⇌ AB (forward exothermic, ΔH = −40 kJ/mol) in a sealed box with a movable wall.
// Reactions happen stochastically at the mass-action rates; molecules drift about randomly.
const MAX = 500, DH = -40, R = 0.008314, T0 = 298;
let mol = [], meshes = {}, size = 12, fwdN = 0, revN = 0, win = 0, flashes = [];
const K = (ctx) => ctx.v.K * Math.exp((-DH / R) * (1 / ctx.v.T - 1 / T0)); // van 't Hoff
function add(type, n, box) { for (let i = 0; i < n; i++) mol.push({ t: type, p: V3((Math.random() - 0.5) * box, (Math.random() - 0.5) * box, (Math.random() - 0.5) * box), v: V3(), axis: V3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize() }); }
function count() { const c = { A: 0, B: 0, C: 0 }; for (const m of mol) c[m.t]++; return c; }
const Vol = () => (size / 12) ** 3; // relative volume
runSim({
  title: "Equilibrium and Le Chatelier's Principle", subtitle: 'Disturb a system at equilibrium and it shifts to partly undo the change.',
  stage: 'studio', camera: { pos: [15, 12, 21], target: [0, 6.5, 0] }, stageOpts: { floorSize: 18 },
  autoplay: true, dt: 1 / 60,
  controls: [
    { id: 'K', label: 'K at 298 K', min: 0.5, max: 20, step: 0.5, value: 4, reset: true },
    { id: 'T', label: 'Temperature', min: 250, max: 400, step: 1, value: 298, unit: 'K' },
    { id: 'size', label: 'Box size (pressure ↑ when smaller)', min: 7, max: 12, step: 0.1, value: 12, fmt: (v) => `${(v / 12 * 100).toFixed(0)} % wide` },
    { id: 'speed', label: 'Reaction speed', min: 0.2, max: 3, step: 0.1, value: 1 },
  ],
  buttons: [
    { id: 'aA', label: '+ Add A', run: () => add('A', 30, size) }, { id: 'aB', label: '+ Add B', run: () => add('B', 30, size) },
    { id: 'aC', label: '+ Add AB', kind: 'ghost', run: () => add('C', 30, size) }, { id: 'rC', label: '− Remove AB', kind: 'ghost', run: () => { let n = 30; mol = mol.filter((m) => !(m.t === 'C' && n-- > 0)); } },
  ],
  readouts: [{ id: 'A', label: 'A' }, { id: 'B', label: 'B' }, { id: 'C', label: 'AB' }, { id: 'Q', label: 'Q = [AB]/[A][B]' }, { id: 'K', label: 'K at this T' }, { id: 'dir', label: 'Net reaction' }],
  graph: { title: 'Number of molecules', series: [{ name: 'A', color: '#ef4444' }, { name: 'B', color: '#3b82f6' }, { name: 'AB', color: '#a855f7' }], max: 900, ymin: 0, window: 30 },
  info: 'At equilibrium the forward reaction (A + B → AB) and the reverse reaction (AB → A + B) keep going at the same rate, so the amounts stop changing. Add A and the forward reaction speeds up until a new balance is reached, using up some of what you added. Squeeze the box and the concentrations rise; the side with fewer molecules (AB) is favoured, lowering the pressure. The forward reaction releases heat, so heating shifts the equilibrium back towards A and B (K falls), while cooling favours AB.',
  formulas: ['A + B ⇌ AB   ΔH = −40 kJ/mol', 'K = [AB] / ([A][B]) at equilibrium', 'Q < K → forward;  Q > K → reverse'],
  onControl(ctx, id, v) { if (id === 'size') { const f = v / size; mol.forEach((m) => m.p.multiplyScalar(f)); size = v; } },
  setup(ctx) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
    ctx.box = new THREE.Group(); ctx.box.add(box, new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: 0x7dd3fc }))); ctx.scene.add(ctx.box);
    const piston = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.04), new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7, roughness: 0.3, transparent: true, opacity: 0.5 })); ctx.box.add(piston); piston.position.z = 0.5;
    const mk = (col) => { const m = new THREE.InstancedMesh(new THREE.SphereGeometry(0.3, 14, 10), new THREE.MeshStandardMaterial({ color: col, roughness: 0.3 }), MAX); m.frustumCulled = false; ctx.scene.add(m); return m; };
    meshes.A = mk(0xef4444); meshes.B = mk(0x3b82f6); meshes.C1 = mk(0xef4444); meshes.C2 = mk(0x3b82f6);
    for (let i = 0; i < 16; i++) { const s = ctx.glowSprite(0xfde68a, 0.01); ctx.scene.add(s); flashes.push({ s, t: 0 }); }
  },
  reset(ctx) { mol = []; size = ctx.v.size; add('A', 90, size); add('B', 90, size); fwdN = revN = 0; },
  step(ctx, dt) {
    const c = count(), V = Vol(), kf = 0.05 * ctx.v.speed, kr = kf / K(ctx) * 40; // scaled so K relates to molecule counts in the full box
    // expected events this step (mass action), realised stochastically
    const fwd = kf * c.A * c.B / (V * 40) * dt, rev = kr * c.C / 40 * dt;
    const nF = Math.floor(fwd) + (Math.random() < fwd % 1 ? 1 : 0), nR = Math.floor(rev) + (Math.random() < rev % 1 ? 1 : 0);
    for (let i = 0; i < nF; i++) {
      const A = mol.filter((m) => m.t === 'A'), B = mol.filter((m) => m.t === 'B'); if (!A.length || !B.length) break;
      const a = A[(Math.random() * A.length) | 0], b = B[(Math.random() * B.length) | 0]; b.dead = true; a.t = 'C'; flash(a.p, 0xfde68a); mol = mol.filter((m) => !m.dead); fwdN++;
    }
    for (let i = 0; i < nR; i++) {
      const Cs = mol.filter((m) => m.t === 'C'); if (!Cs.length) break;
      const cc = Cs[(Math.random() * Cs.length) | 0]; cc.t = 'A'; mol.push({ t: 'B', p: cc.p.clone().addScaledVector(cc.axis, 0.7), v: V3(), axis: V3(1, 0, 0) }); flash(cc.p, 0x93c5fd); revN++;
    }
    // random drift inside the box
    const H = size / 2 - 0.35;
    for (const m of mol) { m.v.x += (Math.random() - 0.5) * 12 * dt; m.v.y += (Math.random() - 0.5) * 12 * dt; m.v.z += (Math.random() - 0.5) * 12 * dt; m.v.multiplyScalar(0.985); m.p.addScaledVector(m.v, dt * 3 * Math.sqrt(ctx.v.T / 298)); for (const ax of ['x', 'y', 'z']) { if (m.p[ax] > H) { m.p[ax] = H; m.v[ax] *= -1; } if (m.p[ax] < -H) { m.p[ax] = -H; m.v[ax] *= -1; } } }
    win += dt; if (win > 1) { ctx.net = fwdN - revN; fwdN = revN = 0; win = 0; }
    ctx.n = (ctx.n || 0) + 1; if (ctx.n % 15 === 0) { const q = count(); ctx.plot(ctx.t, [q.A, q.B, q.C]); }
  },
  frame(ctx, dt) {
    ctx.box.scale.set(size, size, size); ctx.box.position.y = size / 2 + 0.2;
    const m = new THREE.Matrix4(), off = V3(0, size / 2 + 0.2, 0), idx = { A: 0, B: 0, C: 0 };
    for (const o of mol) {
      if (o.t === 'C') { const d = o.axis.clone().multiplyScalar(0.24); m.setPosition(o.p.clone().add(off).sub(d)); meshes.C1.setMatrixAt(idx.C, m); m.setPosition(o.p.clone().add(off).add(d)); meshes.C2.setMatrixAt(idx.C, m); idx.C++; }
      else if (idx[o.t] < MAX) { m.setPosition(o.p.clone().add(off)); meshes[o.t].setMatrixAt(idx[o.t]++, m); }
    }
    meshes.A.count = idx.A; meshes.B.count = idx.B; meshes.C1.count = meshes.C2.count = Math.min(MAX, idx.C);
    for (const k of ['A', 'B', 'C1', 'C2']) meshes[k].instanceMatrix.needsUpdate = true;
    flashes.forEach((f) => { f.t -= dt; f.s.scale.setScalar(f.t > 0 ? 1.4 * f.t / 0.35 + 0.2 : 0.001); if (f.t > 0) f.s.position.copy(f.p).add(off); });
  },
  ui(ctx) {
    const c = count(), V = Vol(), Kt = K(ctx);
    const Qs = (c.C * V) / Math.max(1, c.A * c.B) * 40; // same scaling as the rates: Q = K at balance
    ctx.readout('A', String(c.A)); ctx.readout('B', String(c.B)); ctx.readout('C', String(c.C));
    ctx.readout('Q', Qs.toFixed(2)); ctx.readout('K', Kt.toFixed(2));
    ctx.readout('dir', Math.abs(Qs - Kt) / Kt < 0.3 ? 'At equilibrium ⇌' : Qs < Kt ? 'Shifting forward →' : 'Shifting back ←');
  },
});
function flash(p, col) { const f = flashes.find((q) => q.t <= 0); if (f) { f.t = 0.35; f.p = p.clone(); f.s.material.color.setHex(col); } }
</script>
</body></html>
