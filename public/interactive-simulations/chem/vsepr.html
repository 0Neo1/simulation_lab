<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VSEPR Geometry</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, std, THREE } from '../engine/concept.js';
// Electron domains around a central atom repel each other and spread out on a sphere. Lone
// pairs repel more strongly than bonding pairs, squeezing the bond angles.
const SH = {
  beCl2: ['Linear', 'BeCl₂', 2, 0, 'Be', 'Cl', 'sp'], bf3: ['Trigonal planar', 'BF₃', 3, 0, 'B', 'F', 'sp²'], so2: ['Bent', 'SO₂', 3, 1, 'S', 'O', 'sp²'],
  ch4: ['Tetrahedral', 'CH₄', 4, 0, 'C', 'H', 'sp³'], nh3: ['Trigonal pyramidal', 'NH₃', 4, 1, 'N', 'H', 'sp³'], h2o: ['Bent', 'H₂O', 4, 2, 'O', 'H', 'sp³'],
  pcl5: ['Trigonal bipyramidal', 'PCl₅', 5, 0, 'P', 'Cl', 'sp³d'], sf4: ['See-saw', 'SF₄', 5, 1, 'S', 'F', 'sp³d'], clf3: ['T-shaped', 'ClF₃', 5, 2, 'Cl', 'F', 'sp³d'], xef2: ['Linear', 'XeF₂', 5, 3, 'Xe', 'F', 'sp³d'],
  sf6: ['Octahedral', 'SF₆', 6, 0, 'S', 'F', 'sp³d²'], brf5: ['Square pyramidal', 'BrF₅', 6, 1, 'Br', 'F', 'sp³d²'], xef4: ['Square planar', 'XeF₄', 6, 2, 'Xe', 'F', 'sp³d²'],
};
const COL = { H: 0xf8fafc, C: 0x374151, N: 0x3b82f6, O: 0xef4444, F: 0xa3e635, Cl: 0x22c55e, Be: 0xfbbf24, B: 0xfb923c, S: 0xfacc15, P: 0xf97316, Xe: 0x60a5fa, Br: 0xb45309 };
// ideal domain directions; for 5 and 6 the lone pairs take the positions listed first
function ideal(n) {
  const t = Math.PI * 2 / 3;
  if (n === 2) return [V3(1, 0, 0), V3(-1, 0, 0)];
  if (n === 3) return [0, 1, 2].map((i) => V3(Math.cos(i * t + Math.PI / 2), Math.sin(i * t + Math.PI / 2), 0));
  if (n === 4) return [V3(0, 1, 0), V3(0.943, -0.333, 0), V3(-0.471, -0.333, 0.816), V3(-0.471, -0.333, -0.816)];
  if (n === 5) return [V3(1, 0, 0), V3(Math.cos(t), 0, Math.sin(t)), V3(Math.cos(2 * t), 0, Math.sin(2 * t)), V3(0, 1, 0), V3(0, -1, 0)]; // equatorial first
  return [V3(0, 1, 0), V3(0, -1, 0), V3(1, 0, 0), V3(-1, 0, 0), V3(0, 0, 1), V3(0, 0, -1)]; // axial pair first
}
// relax the domains on a unit sphere with weighted repulsion (LP–LP > LP–BP > BP–BP)
function relax(dirs, lone) {
  const d = dirs.map((v) => v.clone()), w = (i, j) => (i < lone && j < lone ? 1.6 : i < lone || j < lone ? 1.3 : 1);
  for (let it = 0; it < 400; it++) {
    const f = d.map(() => V3());
    for (let i = 0; i < d.length; i++) for (let j = 0; j < d.length; j++) { if (i === j) continue; const r = d[i].clone().sub(d[j]), L = Math.max(0.05, r.length()); f[i].addScaledVector(r, w(i, j) / (L * L * L)); }
    d.forEach((v, i) => { const ft = f[i].clone().addScaledVector(v, -f[i].dot(v)); v.addScaledVector(ft, 0.01).normalize(); });
  }
  return d;
}
let mol, arc, spin = true;
runSim({
  title: 'VSEPR Molecular Shapes', subtitle: 'Electron pairs around a central atom push each other as far apart as possible.',
  stage: 'studio', camera: { pos: [0, 4.5, 10], target: [0, 2.5, 0] }, stageOpts: { floorSize: 12, floorY: -0.5 },
  autoplay: true,
  controls: [
    { id: 'm', label: 'Molecule', type: 'select', value: 'nh3', options: Object.entries(SH).map(([k, s]) => ({ value: k, label: `${s[0]} — ${s[1]}` })) },
    { id: 'lp', label: 'Show lone pairs', type: 'check', value: true },
    { id: 'spin', label: 'Rotate slowly', type: 'check', value: true },
  ],
  readouts: [{ id: 'sh', label: 'Molecular shape' }, { id: 'dom', label: 'Electron domains' }, { id: 'bp', label: 'Bonding pairs' }, { id: 'lp', label: 'Lone pairs' }, { id: 'ang', label: 'Bond angle' }, { id: 'hyb', label: 'Hybridisation' }],
  info: 'Count the electron domains (bonds and lone pairs) around the central atom: 2 give a line, 3 a triangle, 4 a tetrahedron, 5 a trigonal bipyramid and 6 an octahedron. The molecule\'s shape is described by where the atoms are, so lone pairs make it look different: a tetrahedron with one lone pair is a pyramid (NH₃), with two it is bent (H₂O). Lone pairs are held closer to the central atom and repel more strongly, squeezing the bond angles (107° in NH₃, 104.5° in H₂O instead of 109.5°).',
  formulas: ['Domains = bonding pairs + lone pairs', 'Repulsion: LP–LP > LP–BP > BP–BP', 'AXₙEₘ notation'],
  setup(ctx) { mol = new THREE.Group(); mol.position.y = 2.5; ctx.scene.add(mol); ctx.lastKey = ''; },
  frame(ctx) {
    const key = `${ctx.v.m}|${ctx.v.lp}`;
    if (key !== ctx.lastKey) { ctx.lastKey = key; build(ctx); }
    if (ctx.v.spin) mol.rotation.y += 0.004;
  },
  ui(ctx) {
    const s = SH[ctx.v.m];
    ctx.readout('sh', s[0]); ctx.readout('dom', String(s[2])); ctx.readout('bp', String(s[2] - s[3])); ctx.readout('lp', String(s[3]));
    ctx.readout('ang', ctx.angleText || '—'); ctx.readout('hyb', s[6]);
  },
});
function build(ctx) {
  mol.clear(); ctx.tags.forEach((t) => t.el.remove()); ctx.tags.length = 0;
  const [shape, formula, n, lone, cen, lig] = SH[ctx.v.m];
  const dirs = relax(ideal(n), lone), L = 1.9;
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 20), std(COL[cen], { roughness: 0.3 })); mol.add(c);
  const bonds = dirs.slice(lone);
  bonds.forEach((dv) => {
    const a = new THREE.Mesh(new THREE.SphereGeometry(lig === 'H' ? 0.3 : 0.42, 28, 18), std(COL[lig], { roughness: 0.3 })); a.position.copy(dv).multiplyScalar(L); mol.add(a);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, L, 12), std(0xcbd5e1, { metalness: 0.3 })); b.position.copy(dv).multiplyScalar(L / 2); b.quaternion.setFromUnitVectors(V3(0, 1, 0), dv); mol.add(b);
  });
  if (ctx.v.lp) dirs.slice(0, lone).forEach((dv) => {
    const g = new THREE.SphereGeometry(1, 28, 18); g.translate(0, 1, 0);
    const lp = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.35, roughness: 0.2, depthWrite: false })); lp.scale.set(0.42, 0.62, 0.42); lp.quaternion.setFromUnitVectors(V3(0, 1, 0), dv); lp.position.copy(dv).multiplyScalar(0.35); mol.add(lp);
    [-0.12, 0.12].forEach((o) => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), new THREE.MeshBasicMaterial({ color: 0xede9fe })); const side = V3(0, 1, 0).cross(dv).lengthSq() > 0.01 ? V3(0, 1, 0).cross(dv).normalize() : V3(1, 0, 0); e.position.copy(dv).multiplyScalar(0.95).addScaledVector(side, o); mol.add(e); });
  });
  // mark the smallest bond angle with an arc
  let best = null; for (let i = 0; i < bonds.length; i++) for (let j = i + 1; j < bonds.length; j++) { const a = bonds[i].angleTo(bonds[j]); if (!best || a < best.a - 1e-3) best = { a, i, j }; }
  ctx.angleText = best ? `${(best.a * 180 / Math.PI).toFixed(1)}°` + (n >= 5 && lone === 0 ? ' (and 120°/180°)' : '') : '—';
  if (best) {
    const u = bonds[best.i], v = bonds[best.j], pts = [];
    for (let k = 0; k <= 30; k++) { const q = new THREE.Quaternion().setFromUnitVectors(u, v); const qk = new THREE.Quaternion().slerp(q, k / 30); pts.push(u.clone().applyQuaternion(qk).multiplyScalar(0.95)); }
    arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xfde047 })); mol.add(arc);
    const mid = pts[15].clone();
    ctx.label(ctx.angleText.split(' ')[0], () => mol.localToWorld(mid.clone().multiplyScalar(1.35)), 'big');
  }
  ctx.label(formula, () => V3(0, 5.1, 0), 'big');
  void shape;
}
</script>
</body></html>
