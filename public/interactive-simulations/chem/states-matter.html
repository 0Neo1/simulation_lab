<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>States of Matter</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// Molecular dynamics with the Lennard-Jones potential in reduced units (σ = ε = m = 1) inside a
// box with weak gravity. A thermostat pulls the kinetic temperature towards the set value.
const N = 125, L = 9, RC = 2.5, RC2 = RC * RC, G = 0.25, DT = 0.004;
let pos, vel, acc, atoms, Tkin = 0.1, heater, heatMat, coolMat, pe = 0;
function init() {
  pos = new Float32Array(N * 3); vel = new Float32Array(N * 3); acc = new Float32Array(N * 3);
  const a = 1.12; let i = 0;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) for (let z = 0; z < 5; z++) { pos.set([L / 2 + (x - 2) * a + (y % 2) * 0.28, 0.6 + y * a * 0.92, L / 2 + (z - 2) * a + (y % 2) * 0.28], i * 3); i++; }
  for (let k = 0; k < N * 3; k++) vel[k] = (Math.random() - 0.5) * 0.3;
  forces();
}
function forces() {
  acc.fill(0); pe = 0;
  for (let i = 0; i < N; i++) { acc[i * 3 + 1] -= G; }
  for (let i = 0; i < N; i++) {
    const xi = pos[i * 3], yi = pos[i * 3 + 1], zi = pos[i * 3 + 2];
    for (let j = i + 1; j < N; j++) {
      const dx = xi - pos[j * 3], dy = yi - pos[j * 3 + 1], dz = zi - pos[j * 3 + 2], r2 = dx * dx + dy * dy + dz * dz;
      if (r2 > RC2) continue;
      const ir2 = 1 / Math.max(r2, 0.64), ir6 = ir2 * ir2 * ir2, f = 24 * ir6 * (2 * ir6 - 1) * ir2;
      pe += 4 * ir6 * (ir6 - 1);
      acc[i * 3] += f * dx; acc[i * 3 + 1] += f * dy; acc[i * 3 + 2] += f * dz;
      acc[j * 3] -= f * dx; acc[j * 3 + 1] -= f * dy; acc[j * 3 + 2] -= f * dz;
    }
  }
}
const phase = (T) => (T < 0.42 ? 'Solid' : T < 1.05 ? 'Liquid' : 'Gas');
const waterC = (T) => ((T - 0.42) / (1.05 - 0.42)) * 100; // map melting → 0 °C, boiling → 100 °C
runSim({
  title: 'States of Matter', subtitle: 'The same particles form a solid, a liquid or a gas depending on how fast they move.',
  stage: 'studio', camera: { pos: [13, 9, 17], target: [0, 3.2, 0] }, stageOpts: { floorSize: 16 },
  autoplay: true, dt: 1 / 240, timeScale: 1,
  controls: [
    { id: 'T', label: 'Temperature (reduced units)', min: 0.05, max: 2.5, step: 0.01, value: 0.2 },
    { id: 'rate', label: 'Heating speed (thermostat)', min: 0.2, max: 3, step: 0.1, value: 1 },
  ],
  buttons: [
    { id: 's', label: 'Freeze', kind: 'ghost', run: (c) => c.setControl('T', 0.15) },
    { id: 'l', label: 'Melt', kind: 'ghost', run: (c) => c.setControl('T', 0.75) },
    { id: 'g', label: 'Boil', kind: 'warn', run: (c) => c.setControl('T', 1.8) },
  ],
  readouts: [{ id: 'st', label: 'State' }, { id: 'T', label: 'Kinetic temperature' }, { id: 'w', label: 'Like water at' }, { id: 'ke', label: 'Average KE / particle' }, { id: 'pe', label: 'Average PE / particle' }, { id: 'h', label: 'Average height' }],
  graph: { title: 'Temperature and potential energy', series: [{ name: 'T (kinetic)', color: '#f59e0b' }, { name: 'PE / particle', color: '#a78bfa' }], max: 600, window: 20 },
  info: 'Particles attract each other when they are close but repel if they get too close (the Lennard-Jones force). Cold particles only jiggle about fixed places in a regular pattern: a solid. Warmer, they have enough energy to slide past each other but still cling together: a liquid, which takes the shape of the bottom of the box. Hotter still, they break free and fill the whole box: a gas. During melting and boiling, added energy goes into breaking attractions (potential energy rises) rather than into making particles faster.',
  formulas: ['V(r) = 4ε[(σ/r)¹² − (σ/r)⁶]', 'KE_avg = (3/2) k T'],
  setup(ctx) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(L, L, L), new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.08, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }));
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: 0x7dd3fc }));
    const grp = new THREE.Group(); grp.add(box, edges); grp.position.set(0, L / 2 + 0.6, 0); ctx.scene.add(grp);
    heatMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, emissive: 0xff4500, emissiveIntensity: 0 }); coolMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, emissive: 0x38bdf8, emissiveIntensity: 0 });
    heater = mesh(new THREE.BoxGeometry(L + 1, 0.6, L + 1), heatMat); heater.position.y = 0.3; ctx.scene.add(heater);
    atoms = new THREE.InstancedMesh(new THREE.SphereGeometry(0.46, 18, 12), new THREE.MeshStandardMaterial({ roughness: 0.25, metalness: 0.1 }), N); atoms.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3); ctx.scene.add(atoms);
    ctx.label('heater / cooler', () => V3(L / 2 + 0.5, 0.8, L / 2 + 0.5));
  },
  reset(ctx) { init(); Tkin = 0.1; },
  step(ctx) {
    // velocity Verlet with reflecting walls
    for (let k = 0; k < N * 3; k++) { vel[k] += 0.5 * DT * acc[k]; pos[k] += DT * vel[k]; }
    for (let i = 0; i < N; i++) for (let d = 0; d < 3; d++) { const k = i * 3 + d, lo = 0.5, hi = L - 0.5; if (pos[k] < lo) { pos[k] = lo; vel[k] = Math.abs(vel[k]); } if (pos[k] > hi) { pos[k] = hi; vel[k] = -Math.abs(vel[k]); } }
    forces();
    let ke = 0; for (let k = 0; k < N * 3; k++) { vel[k] += 0.5 * DT * acc[k]; ke += vel[k] * vel[k]; }
    Tkin = ke / (3 * N);
    // Berendsen thermostat towards the set temperature
    const tau = 2 / ctx.v.rate, lam = Math.sqrt(1 + (DT / tau) * (ctx.v.T / Math.max(1e-4, Tkin) - 1));
    for (let k = 0; k < N * 3; k++) vel[k] *= lam;
    ctx.n = (ctx.n || 0) + 1; if (ctx.n % 20 === 0) ctx.plot(ctx.t, [Tkin, pe / N]);
  },
  frame(ctx) {
    const m = new THREE.Matrix4(), c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      m.setPosition(pos[i * 3] - L / 2, pos[i * 3 + 1] + 0.6, pos[i * 3 + 2] - L / 2); atoms.setMatrixAt(i, m);
      const sp = Math.hypot(vel[i * 3], vel[i * 3 + 1], vel[i * 3 + 2]); c.setHSL(0.62 - Math.min(0.62, sp * 0.28), 0.8, 0.55); atoms.setColorAt(i, c);
    }
    atoms.instanceMatrix.needsUpdate = true; atoms.instanceColor.needsUpdate = true;
    const dT = ctx.v.T - Tkin; heatMat.emissive.setHex(dT > 0 ? 0xff4500 : 0x38bdf8); heatMat.emissiveIntensity = Math.min(2, Math.abs(dT) * 3);
  },
  ui(ctx) {
    let hy = 0; for (let i = 0; i < N; i++) hy += pos[i * 3 + 1]; hy /= N;
    ctx.readout('st', phase(Tkin)); ctx.readout('T', `${Tkin.toFixed(2)} ε/k`); ctx.readout('w', `${waterC(Tkin).toFixed(0)} °C`);
    ctx.readout('ke', `${(1.5 * Tkin).toFixed(2)} ε`); ctx.readout('pe', `${(pe / N).toFixed(2)} ε`); ctx.readout('h', `${hy.toFixed(2)} σ`);
  },
});
</script>
</body></html>
