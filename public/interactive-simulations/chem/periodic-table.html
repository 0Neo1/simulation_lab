<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Periodic Table</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, std, glow, THREE } from '../engine/concept.js';
import { ELEMENTS } from '../engine/elements.js';
// A 3D periodic table: each element is a tile whose height can show a property. Click a tile.
const CAT = { alkali: ['Alkali metal', '#f87171'], alkaline: ['Alkaline earth metal', '#fb923c'], transition: ['Transition metal', '#facc15'], posttrans: ['Post-transition metal', '#a3e635'], metalloid: ['Metalloid', '#34d399'], nonmetal: ['Non-metal', '#38bdf8'], halogen: ['Halogen', '#818cf8'], noble: ['Noble gas', '#c084fc'], lanth: ['Lanthanide', '#f472b6'], actinide: ['Actinide', '#e879f9'] };
const S = 1.12;
let tiles = [], sel = null, atom, selRing;
const catOf = (e) => CAT[e[5]] || ['Other', '#94a3b8'];
function valence(e) { const g = e[3]; return g <= 2 ? g : g >= 13 ? g - 10 : 2; }
function height(ctx, e) {
  switch (ctx.v.prop) {
    case 'mass': return 0.3 + e[6] / 226 * 4;
    case 'Z': return 0.3 + e[1] / 88 * 4;
    case 'val': return 0.3 + valence(e) * 0.7;
    case 'period': return 0.3 + e[2] * 0.7;
    default: return 0.35;
  }
}
runSim({
  title: 'Periodic Table', subtitle: 'Elements arranged by atomic number: rows are periods (shells), columns are groups with similar chemistry.',
  stage: 'studio', camera: { pos: [0, 21, 13], target: [0, 0, 0.3] }, stageOpts: { floorSize: 24, floorY: -0.05 },
  autoplay: true, hint: 'click an element',
  controls: [
    { id: 'prop', label: 'Tile height shows', type: 'select', value: 'none', options: [{ value: 'none', label: 'Nothing (flat table)' }, { value: 'mass', label: 'Atomic mass' }, { value: 'Z', label: 'Atomic number' }, { value: 'val', label: 'Outer-shell electrons' }, { value: 'period', label: 'Number of shells (period)' }] },
    { id: 'hl', label: 'Highlight', type: 'select', value: 'all', options: [{ value: 'all', label: 'All categories' }].concat(Object.entries(CAT).filter(([k]) => ELEMENTS.some((e) => e[5] === k)).map(([k, [n]]) => ({ value: k, label: n }))) },
  ],
  readouts: [{ id: 'el', label: 'Element' }, { id: 'Z', label: 'Atomic number' }, { id: 'm', label: 'Atomic mass' }, { id: 'pg', label: 'Period / group' }, { id: 'cat', label: 'Category' }, { id: 'cfg', label: 'Configuration' }],
  extraHtml: '<h3>About</h3><p id="note" style="font-size:12.5px;color:#cbd5e1;line-height:1.5">Click any tile to learn about that element.</p><div id="legend" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>',
  info: 'Elements are placed in order of atomic number (protons). A new row (period) starts each time a new electron shell begins to fill, so elements in the same column (group) have the same number of outer electrons and behave alike: the alkali metals in group 1 all react vigorously with water, and the noble gases in group 18 barely react at all. Metals are on the left, non-metals on the right, with the metalloids on the staircase between them. Raise the tiles to see trends such as increasing atomic mass.',
  formulas: ['Period = number of occupied shells', 'Group 1–2, 13–18: outer electrons = group (−10)'],
  pickables: () => tiles,
  onPick(ctx, id) { select(ctx, ELEMENTS.find((e) => e[1] === id)); },
  setup(ctx) {
    ELEMENTS.forEach((e) => {
      const [sym, Z, per, grp, name] = e, [, col] = catOf(e);
      const tex = ctx.canvasTex(128, 128, (g) => { g.fillStyle = col; g.fillRect(0, 0, 128, 128); g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#0f172a'; g.textAlign = 'center'; g.font = 'bold 54px Arial'; g.fillText(sym, 64, 78); g.font = 'bold 22px Arial'; g.textAlign = 'left'; g.fillText(String(Z), 8, 26); g.font = '15px Arial'; g.textAlign = 'center'; g.fillText(name.length > 11 ? name.slice(0, 10) + '.' : name, 64, 112); });
      const side = new THREE.MeshStandardMaterial({ color: col, roughness: 0.45 }), top = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 });
      const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, 0.5, 0);
      const m = new THREE.Mesh(geo, [side, side, top, side, side, side]); m.castShadow = true; m.receiveShadow = true;
      m.position.set((grp - 9.5) * S, 0, (per - 4) * S); m.userData = { pickId: Z, h: 0.35, e }; m.scale.set(0.98, 0.35, 0.98);
      ctx.scene.add(m); tiles.push(m);
    });
    const lg = document.getElementById('legend'); if (lg) lg.innerHTML = Object.values(CAT).filter(([n]) => ELEMENTS.some((e) => catOf(e)[0] === n)).map(([n, c]) => `<span style="font-size:11px;color:#e2e8f0"><i style="display:inline-block;width:10px;height:10px;background:${c};border-radius:2px;margin-right:4px"></i>${n}</span>`).join('');
    selRing = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.06, 1.12), glow(0xfde047)); selRing.visible = false; ctx.scene.add(selRing);
    atom = new THREE.Group(); atom.scale.setScalar(1.7); ctx.scene.add(atom);
    ['1', '2'].forEach((p, i) => { const t = ctx.textSprite(`Group ${p}`, { size: 0.45, color: '#cbd5e1', bg: 'rgba(0,0,0,0)' }); t.position.set((i + 1 - 9.5) * S, 0.1, -3.9 * S + 0.3); ctx.scene.add(t); });
    for (let p = 1; p <= 7; p++) { const t = ctx.textSprite(String(p), { size: 0.5, color: '#94a3b8', bg: 'rgba(0,0,0,0)' }); t.position.set(-9.4 * S, 0.1, (p - 4) * S); ctx.scene.add(t); }
    select(ctx, ELEMENTS[5]);
  },
  frame(ctx) {
    tiles.forEach((m) => {
      const e = m.userData.e, target = height(ctx, e) + (sel === e ? 0.6 : 0);
      m.userData.h += (target - m.userData.h) * 0.12; m.scale.y = m.userData.h;
      const dim = ctx.v.hl !== 'all' && e[5] !== ctx.v.hl; if (m.userData.dim !== dim) { m.userData.dim = dim; m.material.forEach((mt) => { mt.transparent = dim; mt.opacity = dim ? 0.18 : 1; mt.needsUpdate = true; }); }
    });
    if (sel) { const m = tiles.find((t) => t.userData.e === sel); selRing.visible = true; selRing.position.set(m.position.x, m.userData.h + 0.03, m.position.z); atom.position.set(m.position.x, m.userData.h + 3.2, m.position.z); }
    atom.rotation.y = ctx.t * 0.8;
    atom.children.forEach((c) => { if (c.userData.spin) c.rotation.z = ctx.t * c.userData.spin; });
  },
  ui(ctx) {
    if (!sel) return; const e = sel;
    ctx.readout('el', `${e[4]} (${e[0]})`); ctx.readout('Z', String(e[1])); ctx.readout('m', `${e[6]} u`); ctx.readout('pg', `${e[2]} / ${e[3]}`); ctx.readout('cat', catOf(e)[0]); ctx.readout('cfg', e[7]);
  },
});
// a small Bohr-style atom above the selected tile: shells with their electron counts
function select(ctx, e) {
  if (!e) return; sel = e; atom.clear();
  const note = document.getElementById('note'); if (note) note.textContent = `${e[4]}: ${e[8]}`;
  const nuc = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 14), std(0xef4444, { emissive: 0xef4444, emissiveIntensity: 0.4 })); atom.add(nuc);
  // electrons per shell from the Aufbau filling order (La puts its f electron in 5d)
  const ORDER = [[1, 2], [2, 2], [2, 6], [3, 2], [3, 6], [4, 2], [3, 10], [4, 6], [5, 2], [4, 10], [5, 6], [6, 2], [4, 14], [5, 10], [6, 6], [7, 2]];
  const shells = Array(e[2]).fill(0); let left = e[1];
  for (const [n, cap] of ORDER) { if (left <= 0) break; const k = Math.min(cap, left); shells[n - 1] += k; left -= k; }
  if (e[1] === 57) { shells[3] -= 1; shells[4] += 1; }
  shells.forEach((cnt, i) => {
    const R = 0.45 + i * 0.28, grp = new THREE.Group(); grp.rotation.x = Math.PI / 2 - 0.5; grp.userData.spin = 1.5 / (i + 1);
    grp.add(new THREE.Mesh(new THREE.TorusGeometry(R, 0.012, 6, 64), glow(0x64748b)));
    for (let k = 0; k < cnt; k++) { const a = (k / cnt) * Math.PI * 2, d = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), glow(0x7dd3fc)); d.position.set(Math.cos(a) * R, Math.sin(a) * R, 0); grp.add(d); }
    atom.add(grp);
  });
}
</script>
</body></html>
