<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Electron Configuration</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, std, THREE } from '../engine/concept.js';
import { ELEMENTS } from '../engine/elements.js';
// Aufbau filling (with the Cr/Cu/Mo/Ag exceptions) and 3D orbital shapes for each subshell.
const ORDER = [[1, 's'], [2, 's'], [2, 'p'], [3, 's'], [3, 'p'], [4, 's'], [3, 'd'], [4, 'p'], [5, 's'], [4, 'd'], [5, 'p']];
const CAP = { s: 2, p: 6, d: 10 }, SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = (n) => String(n).split('').map((c) => SUP[+c]).join('');
const EXC = { 24: { '3d': 5, '4s': 1 }, 29: { '3d': 10, '4s': 1 }, 42: { '4d': 5, '5s': 1 }, 47: { '4d': 10, '5s': 1 } };
const LCOL = { s: 0x38bdf8, p: 0xf472b6, d: 0xfbbf24 };
function config(Z) {
  const out = []; let left = Z;
  for (const [n, l] of ORDER) { if (left <= 0) break; const k = Math.min(CAP[l], left); out.push({ n, l, e: k }); left -= k; }
  const ex = EXC[Z]; if (ex) for (const s of out) { const key = `${s.n}${s.l}`; if (key in ex) s.e = ex[key]; }
  return out;
}
let orbGroup, eDots, nucleus;
// one lobe (a stretched sphere) pointing along +y
const lobeGeo = new THREE.SphereGeometry(1, 28, 18); lobeGeo.translate(0, 1, 0);
function lobe(len, wid, col, dir, opacity) {
  const m = new THREE.Mesh(lobeGeo, new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity, roughness: 0.3, depthWrite: false, side: THREE.DoubleSide }));
  m.scale.set(wid, len / 2, wid); m.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.clone().normalize()); return m;
}
// shapes of the individual orbitals in a subshell (up to 5), each as lobes
function orbitalShapes(l) {
  if (l === 's') return [[]];
  const X = V3(1, 0, 0), Y = V3(0, 1, 0), Z = V3(0, 0, 1);
  if (l === 'p') return [[X, X.clone().negate()], [Y, Y.clone().negate()], [Z, Z.clone().negate()]];
  const d = (a, b) => [a.clone().add(b), a.clone().sub(b), a.clone().negate().add(b), a.clone().negate().sub(b)];
  return [d(X, Y), d(X, Z), d(Y, Z), [X, X.clone().negate(), Z, Z.clone().negate()], [Y, Y.clone().negate(), 'ring']];
}
runSim({
  title: 'Electron Configuration', subtitle: 'Electrons fill subshells in order of energy: 1s 2s 2p 3s 3p 4s 3d 4p …',
  stage: 'studio', camera: { pos: [9, 7, 13], target: [0, 3, 0] }, stageOpts: { floorSize: 16, floorY: -2 },
  autoplay: true,
  controls: [
    { id: 'Z', label: 'Atomic number Z', min: 1, max: 54, step: 1, value: 8 },
    { id: 'show', label: 'Show orbitals', type: 'select', value: 'last', options: [{ value: 'last', label: 'Last subshell filled' }, { value: 'valence', label: 'All of the outer shell' }, { value: 'all', label: 'Every occupied subshell' }] },
  ],
  buttons: [{ id: 'prev', label: '◀ Previous', kind: 'ghost', run: (c) => c.setControl('Z', Math.max(1, c.v.Z - 1)) }, { id: 'next', label: 'Next ▶', run: (c) => c.setControl('Z', Math.min(54, c.v.Z + 1)) }],
  readouts: [{ id: 'el', label: 'Element' }, { id: 'cfg', label: 'Configuration' }, { id: 'ng', label: 'Noble-gas shorthand' }, { id: 'val', label: 'Valence electrons' }, { id: 'pos', label: 'Period / group' }, { id: 'blk', label: 'Block' }],
  extraHtml: '<h3>Orbital boxes (Hund\'s rule)</h3><canvas id="boxes" width="320" height="200" style="width:100%;background:#0b1220;border-radius:8px"></canvas>',
  info: 'Electrons go into the lowest-energy subshell available (the Aufbau principle). Each orbital holds two electrons with opposite spins (Pauli), and within a subshell electrons spread out one per orbital before pairing up (Hund\'s rule). s orbitals are spheres, p orbitals are dumbbells along x, y and z, and d orbitals are mostly four-leaf clovers. 4s fills before 3d, and chromium and copper borrow a 4s electron to get a half-full or full d subshell.',
  formulas: ['Order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p', 'Capacity: s 2, p 6, d 10', 'Shell n holds 2n² electrons'],
  setup(ctx) {
    nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), std(0xef4444, { emissive: 0xef4444, emissiveIntensity: 0.4 })); nucleus.position.y = 3; ctx.scene.add(nucleus);
    orbGroup = new THREE.Group(); orbGroup.position.y = 3; ctx.scene.add(orbGroup);
    eDots = new THREE.Group(); orbGroup.add(eDots);
    ctx.lastKey = '';
  },
  frame(ctx) {
    const key = `${ctx.v.Z}|${ctx.v.show}`;
    if (key !== ctx.lastKey) { ctx.lastKey = key; build(ctx); drawBoxes(ctx); }
    orbGroup.rotation.y = ctx.t * 0.25;
    eDots.children.forEach((d, i) => { const s = 1 + 0.15 * Math.sin(ctx.t * 5 + i); d.scale.setScalar(s); });
  },
  ui(ctx) {
    const Z = ctx.v.Z, el = ELEMENTS.find((e) => e[1] === Z), cfg = config(Z);
    const full = cfg.map((s) => `${s.n}${s.l}${sup(s.e)}`).join(' ');
    const nobles = [[54, 'Xe'], [36, 'Kr'], [18, 'Ar'], [10, 'Ne'], [2, 'He']], ng = nobles.find(([z]) => z < Z);
    const core = ng ? config(ng[0]).length : 0;
    const shorthand = ng ? `[${ng[1]}] ${cfg.slice(core).map((s) => `${s.n}${s.l}${sup(s.e)}`).join(' ')}` : full;
    const nmax = Math.max(...cfg.map((s) => s.n)), val = cfg.filter((s) => s.n === nmax).reduce((a, s) => a + s.e, 0);
    ctx.readout('el', `${el[4]} (${el[0]})`); ctx.readout('cfg', full.length > 34 ? full.slice(-34).replace(/^\S*\s/, '… ') : full); ctx.readout('ng', shorthand);
    ctx.readout('val', String(val)); ctx.readout('pos', `${el[2]} / ${el[3]}`); ctx.readout('blk', `${cfg[cfg.length - 1].l}-block`);
  },
});
function build(ctx) {
  // clear
  for (let i = orbGroup.children.length - 1; i >= 0; i--) { const c = orbGroup.children[i]; if (c !== eDots) orbGroup.remove(c); }
  eDots.clear();
  const cfg = config(ctx.v.Z), last = cfg[cfg.length - 1], nmax = Math.max(...cfg.map((s) => s.n));
  const shown = ctx.v.show === 'all' ? cfg : ctx.v.show === 'valence' ? cfg.filter((s) => s.n === nmax || (s.l === 'd' && s.n === nmax - 1 && s.e < 10)) : [last];
  // faint shells for context
  for (let n = 1; n <= nmax; n++) { const sh = new THREE.Mesh(new THREE.SphereGeometry(0.6 + n * 0.75, 18, 10), new THREE.MeshBasicMaterial({ color: 0x64748b, wireframe: true, transparent: true, opacity: 0.045 })); orbGroup.add(sh); }
  const eMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, toneMapped: false });
  for (const s of shown) {
    const size = 0.8 + s.n * 0.7, col = LCOL[s.l], op = shown.length > 3 ? 0.18 : 0.32;
    const shapes = orbitalShapes(s.l), nOrb = shapes.length;
    // Hund's rule: electrons per orbital
    const occ = Array.from({ length: nOrb }, (_, i) => (s.e > i ? 1 : 0) + (s.e > nOrb + i ? 1 : 0));
    shapes.forEach((dirs, oi) => {
      if (s.l === 's') { const sp = new THREE.Mesh(new THREE.SphereGeometry(size * 0.75, 32, 20), new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: op * 0.8, depthWrite: false })); orbGroup.add(sp); }
      else dirs.forEach((dv) => { if (dv === 'ring') { const ring = new THREE.Mesh(new THREE.TorusGeometry(size * 0.45, size * 0.14, 12, 40), new THREE.MeshPhysicalMaterial({ color: col, transparent: true, opacity: op, depthWrite: false })); ring.rotation.x = Math.PI / 2; orbGroup.add(ring); } else orbGroup.add(lobe(size * (s.l === 'd' ? 0.9 : 1), size * (s.l === 'd' ? 0.16 : 0.26), col, dv, occ[oi] ? op : op * 0.35)); });
      // electrons sit in the lobes of their orbital
      for (let k = 0; k < occ[oi]; k++) {
        const dv = s.l === 's' ? V3(k ? -1 : 1, 0.3 * (oi + 1), 0.2).normalize() : dirs[k % dirs.length] === 'ring' ? V3(1, 0, 0) : dirs[k % dirs.length];
        const d = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), eMat); d.position.copy(dv.clone().normalize().multiplyScalar(size * (s.l === 's' ? 0.5 : 0.75))); eDots.add(d);
      }
    });
  }
  orbGroup.add(eDots);
}
function drawBoxes(ctx) {
  const cv = document.getElementById('boxes'); if (!cv) return; const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H); const cfg = config(ctx.v.Z); const bw = 20, bh = 18;
  // energy increases upwards: place subshells in filling order, two columns if needed
  cfg.forEach((s, i) => {
    const col = i < 6 ? 0 : 1, row = i < 6 ? i : i - 6, x0 = 10 + col * 160, y = H - 14 - row * 31;
    g.fillStyle = '#cbd5e1'; g.font = 'bold 12px sans-serif'; g.fillText(`${s.n}${s.l}`, x0, y);
    const nOrb = CAP[s.l] / 2;
    for (let o = 0; o < nOrb; o++) {
      const x = x0 + 24 + o * (bw + 3); g.strokeStyle = '#' + LCOL[s.l].toString(16).padStart(6, '0'); g.lineWidth = 1.5; g.strokeRect(x, y - bh + 4, bw, bh);
      const up = s.e > o, dn = s.e > nOrb + o; g.fillStyle = '#f8fafc'; g.font = '14px sans-serif';
      if (up) g.fillText('↑', x + 3, y); if (dn) g.fillText('↓', x + 10, y);
    }
  });
}
</script>
</body></html>
