<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bohr Atom Model</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, std, glow, THREE } from '../engine/concept.js';
// Hydrogen in the Bohr model: allowed orbits rₙ ∝ n², energies Eₙ = −13.6/n² eV. Jumps absorb
// or emit a photon of exactly the energy difference. Orbit sizes are compressed to fit.
const NMAX = 6, rad = (n) => 1.2 + 1.35 * (n - 1) + 0.12 * n * n;
let electron, eTrail, n = 1, anim = null, photon, lines = [], orbitMeshes = [], spectrum = [], eAng = 0;
const E = (k) => -13.6 / (k * k), lam = (a, b) => 1240 / Math.abs(E(a) - E(b));
const series = (lo) => ['', 'Lyman (UV)', 'Balmer (visible)', 'Paschen (IR)', 'Brackett (IR)', 'Pfund (IR)'][lo] || '';
function wl(nm) {
  if (nm < 380) return 0x9d7bff; if (nm > 750) return 0xb33a3a;
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = -(nm - 440) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = -(nm - 510) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = -(nm - 645) / 65; } else r = 1;
  return new THREE.Color(r, g, b).getHex();
}
function jump(ctx, to) {
  if (anim || to === n || to < 1 || to > NMAX) return;
  const up = to > n, L = lam(n, to);
  anim = { from: n, to, t: 0, up, L, col: wl(L) };
  if (!up) spectrum.push({ L, col: wl(L), t: 0 });
  ctx.play();
}
runSim({
  title: 'Bohr Model of Hydrogen', subtitle: 'Electrons occupy fixed energy levels; jumping between them absorbs or emits a photon of one exact colour.',
  stage: 'space', camera: { pos: [2, 15, 31], target: [-3, 0, 0] }, stageOpts: { starRadius: 300 },
  autoplay: true, dt: 1 / 120,
  controls: [
    { id: 'ni', label: 'Start level nᵢ', min: 1, max: NMAX, step: 1, value: 2 },
    { id: 'nf', label: 'Target level n_f', min: 1, max: NMAX, step: 1, value: 4 },
  ],
  buttons: [
    { id: 'go', label: 'Put electron at nᵢ', kind: 'ghost', run: (c) => { if (!anim) n = c.v.ni; } },
    { id: 'ex', label: '⬆ Absorb photon (to n_f)', run: (c) => { if (!anim) { if (c.v.nf > n) jump(c, c.v.nf); else jump(c, Math.min(NMAX, n + 1)); } } },
    { id: 'em', label: '⬇ Emit photon (to n_f)', kind: 'warn', run: (c) => { if (!anim) { if (c.v.nf < n) jump(c, c.v.nf); else jump(c, Math.max(1, n - 1)); } } },
    { id: 'clr', label: 'Clear spectrum', kind: 'ghost', run: () => { spectrum = []; } },
  ],
  readouts: [{ id: 'n', label: 'Electron level n' }, { id: 'En', label: 'Energy Eₙ' }, { id: 'dE', label: 'ΔE (nᵢ → n_f)' }, { id: 'lam', label: 'Photon λ' }, { id: 'ser', label: 'Series' }, { id: 'r', label: 'Orbit radius' }],
  extraHtml: '<h3>Emission spectrum</h3><canvas id="spec" width="320" height="70" style="width:100%;border-radius:8px;background:#000"></canvas><div style="font-size:11px;color:#94a3b8;margin-top:4px">400 nm ← visible → 700 nm (UV and IR lines are shown at the edges)</div>',
  info: 'In Bohr\'s model the electron can only move in certain orbits, each with a fixed energy. It never sits in between. To move up it must absorb a photon whose energy exactly matches the gap; falling back down it gives out a photon of that same energy. Because the gaps are fixed, hydrogen emits only certain colours. The Balmer series (falling to n = 2) gives the red, cyan and violet lines you can see in a hydrogen lamp.',
  formulas: ['Eₙ = −13.6 eV / n²', 'ΔE = h f = h c / λ', 'rₙ = n² × 0.053 nm'],
  setup(ctx) {
    const nuc = new THREE.Group();
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 20), std(0xef4444, { emissive: 0xef4444, emissiveIntensity: 0.35 })); nuc.add(p, ctx.glowSprite(0xff6b6b, 2.6)); ctx.scene.add(nuc);
    ctx.label('proton', () => V3(0, 0.9, 0));
    for (let k = 1; k <= NMAX; k++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rad(k), 0.03, 8, 160), glow(0x60a5fa, { transparent: true, opacity: 0.45 })); ring.rotation.x = Math.PI / 2; ctx.scene.add(ring); orbitMeshes.push(ring);
      const t = ctx.textSprite(`n=${k}`, { size: 0.5, color: '#bfdbfe' }); t.position.set(0.5, 0.3, rad(k)); ctx.scene.add(t);
    }
    electron = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 14), std(0x38bdf8, { emissive: 0x38bdf8, emissiveIntensity: 0.8 })); electron.add(ctx.glowSprite(0x7dd3fc, 1.4)); ctx.scene.add(electron);
    eTrail = ctx.trail(0x7dd3fc, 120); ctx.scene.add(eTrail);
    photon = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 80 }, () => V3())), new THREE.LineBasicMaterial({ color: 0xffffff, toneMapped: false })); photon.visible = false; ctx.scene.add(photon);
    // energy ladder on the side
    const ladder = new THREE.Group(); ladder.position.set(-17, -4.5, 0); ctx.scene.add(ladder);
    for (let k = 1; k <= NMAX; k++) { const y = (E(k) + 13.6) * 0.62; const l = new THREE.Mesh(new THREE.BoxGeometry(3, 0.06, 0.06), glow(0x93c5fd)); l.position.y = y; ladder.add(l); if (k <= 3) { const t = ctx.textSprite(`n=${k}: ${E(k).toFixed(2)} eV`, { size: 0.85, color: '#bfdbfe', bg: 'rgba(0,0,0,0)' }); t.position.set(4.6, y, 0); ladder.add(t); } }
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), glow(0x38bdf8)); ladder.add(dot); ctx.ladderDot = dot; ctx.ladder = ladder;
    ctx.label('energy levels', () => V3(-15.5, 5, 0));
  },
  step(ctx, dt) {
    const r = anim ? rad(anim.from) + (rad(anim.to) - rad(anim.from)) * smooth(Math.max(0, (anim.t - 0.45) / 0.3)) : rad(n);
    eAng += dt * 3.2 / Math.pow(r / rad(1), 1.5) * 1.3; // Kepler-like: outer orbits are slower
    if (anim) {
      anim.t += dt * 0.55;
      if (anim.t >= 1) { n = anim.to; anim = null; photon.visible = false; }
    }
    ctx.r = r;
  },
  frame(ctx, dt) {
    const r = ctx.r ?? rad(n), pos = V3(Math.cos(eAng) * r, 0, -Math.sin(eAng) * r);
    electron.position.copy(pos); eTrail.push(pos);
    orbitMeshes.forEach((o, i) => { o.material.opacity = i + 1 === n && !anim ? 0.9 : 0.35; });
    const lvl = anim ? E(anim.from) + (E(anim.to) - E(anim.from)) * smooth(Math.max(0, (anim.t - 0.45) / 0.3)) : E(n);
    ctx.ladderDot.position.set(0, (lvl + 13.6) * 0.62, 0.1);
    // photon: a wave packet flying in (absorb) or out (emit)
    if (anim) {
      photon.visible = anim.up ? anim.t < 0.5 : anim.t > 0.55;
      photon.material.color.setHex(anim.col);
      const dir = V3(1, 0.35, 0.6).normalize(), k = 2 * Math.PI / Math.max(0.5, Math.min(3, anim.L / 250));
      const s = anim.up ? (0.5 - anim.t) / 0.5 : (anim.t - 0.55) / 0.45; // distance from the electron (0 at the atom)
      const centre = pos.clone().addScaledVector(dir, s * 16), side = V3(0, 1, 0).cross(dir).normalize().add(V3(0, 0.6, 0)).normalize();
      const pts = []; for (let i = 0; i < 80; i++) { const u = (i / 79 - 0.5) * 5; const env = Math.exp(-u * u / 3); pts.push(centre.clone().addScaledVector(dir, u).addScaledVector(side, Math.sin(k * u - ctx.t * 20) * 0.5 * env)); }
      photon.geometry.setFromPoints(pts);
    }
    drawSpectrum(dt);
  },
  ui(ctx) {
    const a = ctx.v.ni, b = ctx.v.nf, dE = Math.abs(E(a) - E(b));
    ctx.readout('n', anim ? `${anim.from} → ${anim.to}` : String(n)); ctx.readout('En', `${E(n).toFixed(2)} eV`);
    ctx.readout('dE', a === b ? '0' : `${dE.toFixed(3)} eV`); ctx.readout('lam', a === b ? '—' : `${lam(a, b).toFixed(1)} nm`);
    ctx.readout('ser', a === b ? '—' : series(Math.min(a, b))); ctx.readout('r', `${(n * n * 0.0529).toFixed(3)} nm`);
  },
});
function smooth(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
function drawSpectrum(dt) {
  const cv = document.getElementById('spec'); if (!cv) return; const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x++) { const nm = 380 + (x / W) * 370; g.fillStyle = '#' + new THREE.Color(wl(nm)).multiplyScalar(0.05).getHexString(); g.fillRect(x, 0, 1, H); }
  for (const s of spectrum) { s.t += dt; const x = s.L < 380 ? 3 : s.L > 750 ? W - 3 : ((s.L - 380) / 370) * W; g.fillStyle = '#' + new THREE.Color(s.col).getHexString(); g.globalAlpha = Math.min(1, s.t * 3); g.fillRect(x - 1.5, 0, 3, H - 16); g.globalAlpha = 1; g.fillStyle = '#e2e8f0'; g.font = '10px sans-serif'; g.fillText(String(Math.round(s.L)), Math.min(W - 24, Math.max(0, x - 10)), H - 4); }
}
</script>
</body></html>
