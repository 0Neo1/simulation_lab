<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reaction Rate</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, THREE } from '../engine/concept.js';
// Collision theory: A + B → AB happens only when a collision carries at least the activation
// energy along the line of centres. Energies in kJ/mol-like units; speeds follow temperature.
const L = 12, RAD = 0.35, MAX = 400;
let mol = [], meshes = {}, flashes = [], hits = 0, good = 0, winT = 0, rateHist = [];
const kB = 0.00831; // "R" in kJ/(mol·K)
const Eeff = (ctx) => ctx.v.Ea * (ctx.v.cat ? 0.55 : 1);
function spawn(type, T) { const s = Math.sqrt(kB * T / (type === 'C' ? 2 : 1)) * 3.2; const g = () => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return (u - 3) / Math.sqrt(0.5); }; return { t: type, p: V3((Math.random() - 0.5) * (L - 1), (Math.random() - 0.5) * (L - 1), (Math.random() - 0.5) * (L - 1)), v: V3(g(), g(), g()).multiplyScalar(s), m: type === 'C' ? 2 : 1 }; }
runSim({
  title: 'Reaction Rate', subtitle: 'Reactions need collisions with enough energy: temperature, concentration and catalysts change how often that happens.',
  stage: 'studio', camera: { pos: [14, 12, 20], target: [0, 6.5, 0] }, stageOpts: { floorSize: 18 },
  autoplay: true, dt: 1 / 240,
  controls: [
    { id: 'T', label: 'Temperature', min: 200, max: 800, step: 10, value: 400, unit: 'K' },
    { id: 'nA', label: 'Molecules of A (red)', min: 20, max: 150, step: 5, value: 80, reset: true },
    { id: 'nB', label: 'Molecules of B (blue)', min: 20, max: 150, step: 5, value: 80, reset: true },
    { id: 'Ea', label: 'Activation energy Eₐ', min: 2, max: 20, step: 0.5, value: 9, unit: 'kJ/mol' },
    { id: 'cat', label: 'Add a catalyst (lowers Eₐ)', type: 'check', value: false },
  ],
  onControl(ctx, id, val) { if (id === 'T') { const f = Math.sqrt(val / ctx.lastT); mol.forEach((m) => m.v.multiplyScalar(f)); ctx.lastT = val; } },
  readouts: [{ id: 'A', label: 'A left' }, { id: 'C', label: 'AB formed' }, { id: 'col', label: 'Collisions / s' }, { id: 'ok', label: 'Successful' }, { id: 'f', label: 'Fraction with E ≥ Eₐ' }, { id: 'k', label: 'Relative k (Arrhenius)' }],
  graph: { title: 'Amounts against time', series: [{ name: 'A', color: '#ef4444' }, { name: 'B', color: '#3b82f6' }, { name: 'AB', color: '#a855f7' }], max: 900, ymin: 0 },
  extraHtml: '<h3>Energy profile</h3><canvas id="ep" width="320" height="150" style="width:100%;background:#0b1220;border-radius:8px"></canvas>',
  info: 'Molecules are always moving and colliding, but most collisions just bounce. A reaction happens only if the colliding pair has at least the activation energy Eₐ. Raising the temperature makes molecules faster, so they collide more often and, far more importantly, a much larger fraction of collisions has enough energy. More molecules in the same space means more collisions. A catalyst gives the reaction an easier path with a lower Eₐ, so more collisions succeed at the same temperature.',
  formulas: ['k = A e^(−Eₐ / RT)  (Arrhenius)', 'rate = k [A][B]', 'fraction ≈ e^(−Eₐ / RT)'],
  setup(ctx) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(L, L, L), new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
    const grp = new THREE.Group(); grp.add(box, new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: 0x7dd3fc }))); grp.position.y = L / 2 + 0.2; ctx.scene.add(grp);
    const mk = (col, r) => { const m = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: col, roughness: 0.3, metalness: 0.1 }), MAX); m.frustumCulled = false; ctx.scene.add(m); return m; };
    meshes.A = mk(0xef4444, RAD); meshes.B = mk(0x3b82f6, RAD);
    // AB drawn as two fused spheres
    meshes.C1 = mk(0xef4444, RAD); meshes.C2 = mk(0x3b82f6, RAD);
    for (let i = 0; i < 12; i++) { const s = ctx.glowSprite(0xfff3b0, 0.01); ctx.scene.add(s); flashes.push({ s, t: 0 }); }
    ctx.lastT = ctx.v.T;
  },
  reset(ctx) { mol = []; for (let i = 0; i < ctx.v.nA; i++) mol.push(spawn('A', ctx.v.T)); for (let i = 0; i < ctx.v.nB; i++) mol.push(spawn('B', ctx.v.T)); hits = good = 0; winT = 0; ctx.lastT = ctx.v.T; ctx.rates = { col: 0, ok: 0 }; },
  step(ctx, dt) {
    const H = L / 2 - RAD, Ea = Eeff(ctx);
    for (const m of mol) { m.p.addScaledVector(m.v, dt); for (const ax of ['x', 'y', 'z']) { if (m.p[ax] > H) { m.p[ax] = H; m.v[ax] = -Math.abs(m.v[ax]); } if (m.p[ax] < -H) { m.p[ax] = -H; m.v[ax] = Math.abs(m.v[ax]); } } }
    // pair collisions (elastic unless A–B with enough energy → AB)
    const d2 = (2 * RAD) ** 2;
    for (let i = 0; i < mol.length; i++) for (let j = i + 1; j < mol.length; j++) {
      const a = mol[i], b = mol[j]; if (!a || !b || a.dead || b.dead) continue;
      const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z, r2 = dx * dx + dy * dy + dz * dz;
      if (r2 > d2 || r2 < 1e-9) continue;
      const r = Math.sqrt(r2), nx = dx / r, ny = dy / r, nz = dz / r, vr = (a.v.x - b.v.x) * nx + (a.v.y - b.v.y) * ny + (a.v.z - b.v.z) * nz;
      if (vr <= 0) continue; // moving apart
      hits++;
      // energy of the collision along the line of centres, in kJ/mol (speeds carry a factor 3.2)
      const mu = a.m * b.m / (a.m + b.m), E = 0.5 * mu * (vr / 3.2) ** 2;
      if (((a.t === 'A' && b.t === 'B') || (a.t === 'B' && b.t === 'A')) && E >= Ea) {
        good++; const c = { t: 'C', m: 2, p: a.p.clone().add(b.p).multiplyScalar(0.5), v: a.v.clone().add(b.v).multiplyScalar(0.5), axis: V3(nx, ny, nz) };
        a.dead = b.dead = true; mol.push(c);
        const f = flashes.find((q) => q.t <= 0); if (f) { f.t = 0.4; f.s.position.copy(c.p).add(V3(0, L / 2 + 0.2, 0)); }
        continue;
      }
      const J = (2 * vr) / (1 / a.m + 1 / b.m);
      a.v.x -= (J / a.m) * nx; a.v.y -= (J / a.m) * ny; a.v.z -= (J / a.m) * nz; b.v.x += (J / b.m) * nx; b.v.y += (J / b.m) * ny; b.v.z += (J / b.m) * nz;
    }
    if (mol.some((m) => m.dead)) mol = mol.filter((m) => !m.dead);
    winT += dt; if (winT >= 1) { ctx.rates = { col: hits / winT, ok: good / winT }; hits = good = 0; winT = 0; }
    ctx.n = (ctx.n || 0) + 1; if (ctx.n % 24 === 0) { const c = count(); ctx.plot(ctx.t, [c.A, c.B, c.C]); }
  },
  frame(ctx, dt) {
    const m = new THREE.Matrix4(), idx = { A: 0, B: 0, C: 0 }, off = V3(0, L / 2 + 0.2, 0);
    for (const o of mol) {
      if (o.t === 'C') { const d = o.axis.clone().multiplyScalar(RAD * 0.75); m.setPosition(o.p.clone().add(off).sub(d)); meshes.C1.setMatrixAt(idx.C, m); m.setPosition(o.p.clone().add(off).add(d)); meshes.C2.setMatrixAt(idx.C, m); idx.C++; }
      else { m.setPosition(o.p.clone().add(off)); meshes[o.t].setMatrixAt(idx[o.t]++, m); }
    }
    meshes.A.count = idx.A; meshes.B.count = idx.B; meshes.C1.count = meshes.C2.count = idx.C;
    for (const k of ['A', 'B', 'C1', 'C2']) meshes[k].instanceMatrix.needsUpdate = true;
    flashes.forEach((f) => { f.t -= dt; f.s.scale.setScalar(f.t > 0 ? 1.6 * f.t / 0.4 + 0.3 : 0.001); });
  },
  ui(ctx) {
    const c = count(), Ea = Eeff(ctx), T = ctx.v.T, frac = Math.exp(-Ea / (kB * T));
    ctx.readout('A', String(c.A)); ctx.readout('C', String(c.C)); ctx.readout('col', (ctx.rates?.col || 0).toFixed(0)); ctx.readout('ok', `${(ctx.rates?.ok || 0).toFixed(1)} / s`);
    ctx.readout('f', `${(frac * 100).toFixed(frac < 0.01 ? 3 : 1)} %`); ctx.readout('k', `× ${(frac / Math.exp(-ctx.v.Ea / (kB * 400))).toFixed(2)} vs 400 K, no catalyst`);
    drawProfile(ctx);
  },
});
function count() { const c = { A: 0, B: 0, C: 0 }; for (const m of mol) c[m.t]++; return c; }
function drawProfile(ctx) {
  const cv = document.getElementById('ep'); if (!cv) return; const g = cv.getContext('2d'), W = cv.width, Hh = cv.height;
  g.clearRect(0, 0, W, Hh); const base = Hh - 30, prodY = base + 12, sc = 5.2;
  const curve = (Ea, col, dash) => { g.strokeStyle = col; g.setLineDash(dash); g.lineWidth = 2.2; g.beginPath(); for (let x = 0; x <= 1; x += 0.01) { const px = 20 + x * (W - 40), bump = Math.exp(-((x - 0.5) ** 2) / 0.018) * Ea * sc, drift = (x < 0.5 ? 0 : (x - 0.5) / 0.5) * (prodY - base) * (x > 0.5 ? 1 : 0); const py = base - bump + drift * (1 - Math.exp(-((x - 0.5) ** 2) / 0.018)); x ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); g.setLineDash([]); };
  curve(ctx.v.Ea, '#f59e0b', []); if (ctx.v.cat) curve(Eeff(ctx), '#22c55e', [5, 4]);
  g.fillStyle = '#cbd5e1'; g.font = '11px sans-serif'; g.fillText('A + B', 16, base + 16); g.fillText('AB', W - 36, prodY + 14);
  g.strokeStyle = '#94a3b8'; g.beginPath(); g.moveTo(W / 2 + 8, base); g.lineTo(W / 2 + 8, base - Eeff(ctx) * sc); g.stroke();
  g.fillText(`Eₐ = ${Eeff(ctx).toFixed(1)}`, W / 2 + 12, base - Eeff(ctx) * sc / 2); if (ctx.v.cat) { g.fillStyle = '#22c55e'; g.fillText('with catalyst', W / 2 + 12, base - Eeff(ctx) * sc / 2 + 14); }
}
</script>
</body></html>
