<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vector Addition</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, THREE, mesh, std } from '../engine/concept.js';
// Units: arbitrary (vector magnitudes), shown in 3D space
let A, B, R, Ax, Ay, Bx, By, gridG, para;
runSim({
  title: 'Vector Addition', subtitle: 'Add two vectors tip-to-tail and by the parallelogram rule — in three dimensions.',
  stage: 'studio', camera: { pos: [4, 9, 16], target: [3, 2, 0] }, autoplay: true,
  controls: [
    { id: 'am', label: '|A|', min: 0, max: 8, step: 0.1, value: 5 },
    { id: 'aa', label: 'A direction (in plane)', min: -180, max: 180, step: 1, value: 20, unit: '°' },
    { id: 'ae', label: 'A elevation', min: -60, max: 60, step: 1, value: 0, unit: '°' },
    { id: 'bm', label: '|B|', min: 0, max: 8, step: 0.1, value: 4 },
    { id: 'ba', label: 'B direction (in plane)', min: -180, max: 180, step: 1, value: 80, unit: '°' },
    { id: 'be', label: 'B elevation', min: -60, max: 60, step: 1, value: 0, unit: '°' },
    { id: 'tip', label: 'Show tip-to-tail', type: 'check', value: true },
    { id: 'comp', label: 'Show components', type: 'check', value: true },
  ],
  readouts: [{ id: 'R', label: '|R| = |A + B|' }, { id: 'Rd', label: 'R direction' }, { id: 'Rx', label: 'Rx' }, { id: 'Ry', label: 'Ry' }, { id: 'Rz', label: 'Rz' }, { id: 'ang', label: 'Angle between A and B' }],
  info: 'Vectors add component by component. Draw B starting at the tip of A: the resultant R runs from the tail of A to the tip of B. The same R is the diagonal of the parallelogram with sides A and B. |R| is largest when A and B point the same way and smallest when they are opposite.',
  formulas: ['R = A + B', 'Rₓ = Aₓ + Bₓ,  R_y = A_y + B_y', '|R|² = A² + B² + 2AB cos θ'],
  setup(ctx) {
    A = ctx.arrow(0x22d3ee, { radius: 0.07, head: 0.45 }); B = ctx.arrow(0xf59e0b, { radius: 0.07, head: 0.45 }); R = ctx.arrow(0xa3e635, { radius: 0.09, head: 0.55 });
    Ax = ctx.arrow(0x0e7490, { radius: 0.03, head: 0.25 }); Ay = ctx.arrow(0x0e7490, { radius: 0.03, head: 0.25 }); Bx = ctx.arrow(0xb45309, { radius: 0.03, head: 0.25 }); By = ctx.arrow(0xb45309, { radius: 0.03, head: 0.25 });
    ctx.B2 = ctx.arrow(0xf59e0b, { radius: 0.05, head: 0.35 }); ctx.B2.material.transparent = true; ctx.B2.material.opacity = 0.55;
    ctx.scene.add(A, B, R, Ax, Ay, Bx, By, ctx.B2);
    [[V3(9, 0, 0), 0xef4444], [V3(0, 0, -9), 0x22c55e], [V3(0, 9, 0), 0x3b82f6]].forEach(([d, c]) => { const ax = ctx.arrow(c, { radius: 0.025, head: 0.3 }); ax.set(V3(), d); ctx.scene.add(ax); });
    para = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.2, gapSize: 0.15 })); ctx.scene.add(para);
    ctx.label('A', () => vec(ctx, 'a').multiplyScalar(0.5).add(V3(0, 0.5, 0)));
    ctx.label('B', () => vec(ctx, 'b').multiplyScalar(0.5).add(V3(0, 0.5, 0)));
    ctx.label('R = A + B', () => vec(ctx, 'a').add(vec(ctx, 'b')).add(V3(0, 0.6, 0)), 'big');
    ctx.label('x', () => V3(9.3, 0, 0)); ctx.label('z (up)', () => V3(0, 9.3, 0)); ctx.label('y', () => V3(0, 0, -9.3));
  },
  frame(ctx) {
    const a = vec(ctx, 'a'), b = vec(ctx, 'b'), r = a.clone().add(b), O = V3();
    A.set(O, a); B.set(O, b); R.set(O, r);
    ctx.B2.set(a, b); ctx.B2.visible = ctx.v.tip && b.length() > 0.01;
    const c = ctx.v.comp;
    Ax.set(O, V3(a.x, 0, 0)); Ay.set(V3(a.x, 0, 0), V3(0, 0, a.z)); Bx.set(O, V3(b.x, 0, 0)); By.set(V3(b.x, 0, 0), V3(0, 0, b.z));
    [Ax, Ay, Bx, By].forEach((q) => { q.visible = q.visible && c; });
    para.geometry.dispose(); para.geometry = new THREE.BufferGeometry().setFromPoints([a, r, b, r]); para.computeLineDistances();
  },
  ui(ctx) {
    const a = vec(ctx, 'a'), b = vec(ctx, 'b'), r = a.clone().add(b);
    ctx.readout('R', r.length().toFixed(2)); ctx.readout('Rd', `${(Math.atan2(-r.z, r.x) * 180 / Math.PI).toFixed(1)}°`);
    ctx.readout('Rx', r.x.toFixed(2)); ctx.readout('Ry', (-r.z).toFixed(2)); ctx.readout('Rz', r.y.toFixed(2));
    ctx.readout('ang', a.length() && b.length() ? `${(a.angleTo(b) * 180 / Math.PI).toFixed(1)}°` : '—');
  },
});
// direction angle measured in the horizontal x–y plane (y drawn into the screen), elevation upward
function vec(ctx, k) { const m = ctx.v[`${k}m`], az = ctx.v[`${k}a`] * Math.PI / 180, el = ctx.v[`${k}e`] * Math.PI / 180; return V3(Math.cos(el) * Math.cos(az) * m, Math.sin(el) * m, -Math.cos(el) * Math.sin(az) * m); }
</script>
</body></html>
