<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbital Motion</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, glow, glowSprite, THREE } from '../engine/concept.js';
// Scaled units: distance in AU (1 unit = 10 scene units), time in years; GM_sun = 4π² AU³/yr².
const S = 10;
let star, planet, p, v, tr, aV, aF, rMin, rMax, tPrev, period, lastY;
runSim({
  title: 'Orbital Motion', subtitle: 'Give a planet a push and watch gravity bend its path into an ellipse.',
  stage: 'space', camera: { pos: [0, 28, 26], target: [0, 0, 0] }, timeScale: 0.25, dt: 1 / 2000,
  controls: [
    { id: 'r0', label: 'Starting distance', min: 0.4, max: 2, step: 0.05, value: 1, unit: 'AU', reset: true },
    { id: 'v0', label: 'Starting speed', min: 2, max: 10, step: 0.1, value: 6.28, unit: 'AU/yr', reset: true },
    { id: 'M', label: 'Star mass', min: 0.3, max: 3, step: 0.05, value: 1, unit: 'M☉' },
  ],
  readouts: [{ id: 'r', label: 'Distance' }, { id: 'v', label: 'Speed' }, { id: 'T', label: 'Period (measured)' }, { id: 'e', label: 'Eccentricity' }, { id: 'E', label: 'Energy' }, { id: 'kind', label: 'Orbit' }],
  graph: { title: 'Distance and speed', series: [{ name: 'r (AU)', color: '#22d3ee' }, { name: 'v (AU/yr)', color: '#f59e0b' }], max: 900 },
  info: 'The star pulls the planet towards it with a force that falls off as 1/r². At exactly the circular speed the orbit is a circle (1 AU, 2π AU/yr for the Sun); slower gives an ellipse with the star at one focus; faster than escape speed (√2 times circular) and the planet never returns. The planet moves fastest nearest the star — Kepler’s second law.',
  formulas: ['F = G M m / r²', 'v_circ = √(GM/r),  v_esc = √(2GM/r)', 'T² ∝ a³  (Kepler’s third law)'],
  setup(ctx) {
    star = mesh(new THREE.SphereGeometry(1.6, 40, 28), glow(0xffd166), false); ctx.scene.add(star);
    const halo = glowSprite(0xffb703, 9); star.add(halo);
    ctx.light = new THREE.PointLight(0xfff1c1, 1500, 0, 1.5); ctx.scene.add(ctx.light);
    planet = mesh(new THREE.SphereGeometry(0.55, 32, 20), new THREE.MeshStandardMaterial({ map: ctx.canvasTex(256, 128, (g, w, h) => { g.fillStyle = '#1d4ed8'; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { g.fillStyle = '#16a34a'; g.beginPath(); g.ellipse(Math.random() * w, 20 + Math.random() * (h - 40), 8 + Math.random() * 20, 4 + Math.random() * 10, Math.random(), 0, 7); g.fill(); } g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(0, 0, w, 10); g.fillRect(0, h - 10, w, 10); }), roughness: 0.7 }));
    ctx.scene.add(planet);
    tr = ctx.trail(0x93c5fd, 3000); ctx.scene.add(tr);
    aV = ctx.arrow(0x22c55e, { radius: 0.08, head: 0.5 }); aF = ctx.arrow(0xef4444, { radius: 0.08, head: 0.5 }); ctx.scene.add(aV, aF);
    ctx.label('velocity', () => planet.position.clone().add(v.clone().normalize().multiplyScalar(3)).add(V3(0, 1, 0)));
    ctx.label('gravity', () => planet.position.clone().add(p.clone().normalize().multiplyScalar(-2.5 * S / 10)).add(V3(0, 1, 0)));
    const grid = new THREE.PolarGridHelper(30, 12, 6, 64, 0x1e3a5f, 0x1e3a5f); grid.material.transparent = true; grid.material.opacity = 0.35; ctx.scene.add(grid);
  },
  reset(ctx) { p = V3(ctx.v.r0, 0, 0); v = V3(0, 0, -ctx.v.v0); tr.clear(); rMin = rMax = ctx.v.r0; period = null; tPrev = 0; lastY = 0; },
  step(ctx, dt) {
    const GM = 4 * Math.PI * Math.PI * ctx.v.M;
    // velocity Verlet
    const acc = (q) => q.clone().multiplyScalar(-GM / q.lengthSq() ** 1.5);
    const a1 = acc(p);
    p.addScaledVector(v, dt).addScaledVector(a1, 0.5 * dt * dt);
    v.addScaledVector(a1.add(acc(p)), 0.5 * dt);
    const r = p.length(); rMin = Math.min(rMin, r); rMax = Math.max(rMax, r);
    if (lastY > 0 && p.z <= 0 && p.x > 0) { if (tPrev) period = ctx.t - tPrev; tPrev = ctx.t; }
    lastY = p.z;
    ctx.sc = (ctx.sc || 0) + 1; if (ctx.sc % 40 === 0) { tr.push(p.clone().multiplyScalar(S)); ctx.plot(ctx.t, [r, v.length()]); }
  },
  frame(ctx, dt) { planet.position.copy(p).multiplyScalar(S); planet.rotation.y += dt * 2; star.rotation.y += dt * 0.2; aV.set(planet.position, v, 0.35); aF.set(planet.position, p.clone().multiplyScalar(-1 / p.lengthSq()), 1.6); },
  ui(ctx) {
    const GM = 4 * Math.PI * Math.PI * ctx.v.M, E = 0.5 * v.lengthSq() - GM / p.length();
    const e = (rMax - rMin) / (rMax + rMin);
    ctx.readout('r', `${p.length().toFixed(3)} AU`); ctx.readout('v', `${v.length().toFixed(2)} AU/yr`);
    ctx.readout('T', period ? `${period.toFixed(3)} yr` : '—'); ctx.readout('e', E < 0 ? e.toFixed(3) : '—');
    ctx.readout('E', `${E.toFixed(2)} (per unit mass)`); ctx.readout('kind', E >= 0 ? 'escaping (unbound)' : e < 0.02 ? 'circle' : 'ellipse');
  },
});
</script>
</body></html>
