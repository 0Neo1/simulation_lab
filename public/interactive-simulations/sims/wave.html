<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wave Properties</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, glow, THREE } from '../engine/concept.js';
// A travelling wave on a row of beads (transverse) or a stretched slinky (longitudinal).
const N = 90, X0 = -9, X1 = 9;
let beads, rings, cord, tracer, marks, lamArrow, lamTag;
const bx = (i) => X0 + (i / (N - 1)) * (X1 - X0);
runSim({
  title: 'Wave Properties', subtitle: 'Particles only oscillate in place — the wave pattern is what travels, at v = fλ.',
  stage: 'studio', camera: { pos: [0, 6.5, 23], target: [0, 2.3, 0] }, stageOpts: { floorSize: 22, gridDiv: 22 },
  autoplay: true,
  controls: [
    { id: 'type', label: 'Wave type', type: 'select', value: 'trans', options: [{ value: 'trans', label: 'Transverse (beads on a string)' }, { value: 'long', label: 'Longitudinal (slinky)' }] },
    { id: 'A', label: 'Amplitude', min: 0.1, max: 1.5, step: 0.05, value: 0.8, unit: 'm' },
    { id: 'lam', label: 'Wavelength λ', min: 2, max: 12, step: 0.1, value: 6, unit: 'm' },
    { id: 'f', label: 'Frequency f', min: 0.1, max: 2, step: 0.05, value: 0.5, unit: 'Hz' },
    { id: 'dir', label: 'Direction', type: 'select', value: 1, options: [{ value: 1, label: 'Travels right →' }, { value: -1, label: '← Travels left' }] },
  ],
  readouts: [{ id: 'v', label: 'Wave speed v = fλ' }, { id: 'T', label: 'Period T = 1/f' }, { id: 'k', label: 'Wave number k' }, { id: 'w', label: 'ω = 2πf' }, { id: 'y', label: 'Red bead displacement' }, { id: 'vy', label: 'Red bead velocity' }],
  graph: { title: 'Red bead displacement vs time', series: [{ name: 'y (m)', color: '#ef4444' }], max: 600, window: 8 },
  info: 'Follow the red bead: it just moves up and down (or back and forth for a longitudinal wave) around its own rest position, while the crests march along. In one period T the wave moves forward exactly one wavelength, which is why v = λ / T = fλ. Doubling the frequency with the same speed would halve the wavelength.',
  formulas: ['y(x, t) = A sin(kx − ωt)', 'v = f λ', 'k = 2π / λ,  ω = 2π f'],
  setup(ctx) {
    beads = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 16, 10), std(0x38bdf8, { metalness: 0.2 }), N);
    beads.castShadow = true;
    cord = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: N }, () => V3())), new THREE.LineBasicMaterial({ color: 0x94a3b8 }));
    rings = new THREE.InstancedMesh(new THREE.TorusGeometry(0.7, 0.05, 8, 28), std(0xcbd5e1, { metalness: 0.9, roughness: 0.3 }), N);
    tracer = mesh(new THREE.SphereGeometry(0.24, 20, 14), std(0xef4444, { emissive: 0xef4444, emissiveIntensity: 0.4 }));
    [X0 - 0.4, X1 + 0.4].forEach((x) => { const p = mesh(new THREE.CylinderGeometry(0.1, 0.1, 5, 12), MAT.steel); p.position.set(x, 2.5, 0); ctx.scene.add(p); });
    const rest = mesh(new THREE.BoxGeometry(X1 - X0, 0.02, 0.02), glow(0x475569)); rest.position.set(0, 2.5, 0);
    lamArrow = new THREE.Group();
    const lm = glow(0xfde68a); const bar = mesh(new THREE.BoxGeometry(1, 0.04, 0.04), lm); const c1 = mesh(new THREE.BoxGeometry(0.04, 0.4, 0.04), lm), c2 = c1.clone();
    lamArrow.add(bar, c1, c2); lamArrow.bar = bar; lamArrow.c = [c1, c2];
    ctx.scene.add(beads, cord, rings, tracer, rest, lamArrow);
    lamTag = ctx.label('λ', () => lamArrow.visible ? lamArrow.position.clone().add(V3(0, 0.25, 0)) : null, 'big');
    ctx.label('red bead', () => tracer.position.clone().add(V3(0, 0.45, 0)));
  },
  step(ctx) { ctx.n = (ctx.n || 0) + 1; if (ctx.n % 10 === 0) ctx.plot(ctx.t, [disp(ctx, bx(Math.round(N / 2)))]); },
  frame(ctx) {
    const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(V3(0, 1, 0), Math.PI / 2), one = V3(1, 1, 1);
    const trans = ctx.v.type === 'trans';
    beads.visible = cord.visible = trans; rings.visible = !trans;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const x = bx(i), d = disp(ctx, x);
      const p = trans ? V3(x, 2.5 + d, 0) : V3(x + d * 0.5, 2.5, 0);
      pts.push(p);
      m.compose(p, trans ? new THREE.Quaternion() : q, one);
      (trans ? beads : rings).setMatrixAt(i, m);
    }
    beads.instanceMatrix.needsUpdate = true; rings.instanceMatrix.needsUpdate = true;
    cord.geometry.setFromPoints(pts);
    const mid = Math.round(N / 2); tracer.position.copy(pts[mid]); if (!trans) tracer.position.y = 3.3;
    // mark one wavelength between two neighbouring crests (or compressions)
    const k = 2 * Math.PI / ctx.v.lam, w = 2 * Math.PI * ctx.v.f * ctx.v.dir;
    let xc = (Math.PI / 2 + w * ctx.t) / k; xc = X0 + ((((xc - X0) % ctx.v.lam) + ctx.v.lam) % ctx.v.lam);
    const L = ctx.v.lam;
    lamArrow.visible = xc + L <= X1;
    if (lamArrow.visible) { lamArrow.position.set(xc + L / 2, 2.5 + ctx.v.A + 0.5, 0); lamArrow.bar.scale.x = L; lamArrow.c[0].position.x = -L / 2; lamArrow.c[1].position.x = L / 2; }
  },
  ui(ctx) {
    const { f, lam } = ctx.v, x = bx(Math.round(N / 2));
    ctx.readout('v', `${(f * lam).toFixed(2)} m/s`); ctx.readout('T', `${(1 / f).toFixed(2)} s`);
    ctx.readout('k', `${(2 * Math.PI / lam).toFixed(3)} rad/m`); ctx.readout('w', `${(2 * Math.PI * f).toFixed(3)} rad/s`);
    ctx.readout('y', `${disp(ctx, x).toFixed(2)} m`);
    const e = 1e-3; ctx.readout('vy', `${((disp(ctx, x, ctx.t + e) - disp(ctx, x)) / e).toFixed(2)} m/s`);
  },
});
function disp(ctx, x, t = ctx.t) { const k = 2 * Math.PI / ctx.v.lam, w = 2 * Math.PI * ctx.v.f; return ctx.v.A * Math.sin(k * x - ctx.v.dir * w * t); }
</script>
</body></html>
