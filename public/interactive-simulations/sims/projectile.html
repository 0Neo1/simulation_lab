<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projectile Motion</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// Units: metres, outdoors
let ball, barrel, carriage, tr, vx, vy, vz, pos, flying, maxH, land, ghost, flag, velA;
runSim({
  title: 'Projectile Motion', subtitle: 'Fire a ball from a cannon and trace its path — with or without air resistance.',
  stage: 'field', camera: { pos: [-18, 14, 46], target: [28, 6, 0], far: 3000 }, sun: { pos: [30, 60, 30], size: 70, far: 300 },
  controls: [
    { id: 'ang', label: 'Launch angle', min: 5, max: 85, step: 1, value: 45, unit: '°' },
    { id: 'v0', label: 'Launch speed', min: 5, max: 40, step: 0.5, value: 22, unit: 'm/s' },
    { id: 'h0', label: 'Launch height', min: 0, max: 20, step: 0.5, value: 1, unit: 'm' },
    { id: 'g', label: 'Gravity', min: 1.6, max: 25, step: 0.1, value: 9.8, unit: 'm/s²' },
    { id: 'drag', label: 'Air resistance', type: 'check', value: false },
  ],
  buttons: [{ id: 'fire', label: '🔥 Fire', run: (ctx) => fire(ctx) }, { id: 'clear', label: 'Clear trails', kind: 'ghost', run: (ctx) => { ctx.trails.forEach((t) => ctx.scene.remove(t)); ctx.trails = []; } }],
  readouts: [{ id: 't', label: 'Time' }, { id: 'x', label: 'Range x' }, { id: 'y', label: 'Height y' }, { id: 'v', label: 'Speed' }, { id: 'R', label: 'Predicted range' }, { id: 'H', label: 'Predicted max height' }],
  graph: { title: 'Height and speed', series: [{ name: 'y (m)', color: '#22d3ee' }, { name: 'speed (m/s)', color: '#f59e0b' }] },
  info: 'Once fired, gravity is the only force (without drag), so the horizontal velocity stays constant and the vertical velocity changes at g. The path is a parabola; 45° gives the longest range on level ground. Turn on air resistance to see the path shorten and lose its symmetry.',
  formulas: ['x = v₀ cos θ · t', 'y = h + v₀ sin θ · t − ½ g t²', 'R = v₀² sin 2θ / g  (h = 0)'],
  setup(ctx) {
    ctx.trails = [];
    carriage = new THREE.Group();
    const wood = std(0x6b4423);
    [-0.7, 0.7].forEach((z) => { const w = mesh(new THREE.TorusGeometry(0.6, 0.1, 10, 24), wood); w.position.set(0, 0.6, z); carriage.add(w); const hub = mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.2, 10), MAT.darkSteel); hub.rotation.x = Math.PI / 2; hub.position.set(0, 0.6, z); carriage.add(hub); });
    const frame = mesh(new THREE.BoxGeometry(1.6, 0.25, 1.1), wood); frame.position.set(-0.4, 0.75, 0); carriage.add(frame);
    barrel = new THREE.Group();
    const tube = mesh(new THREE.CylinderGeometry(0.22, 0.3, 2.2, 20), MAT.darkSteel); tube.rotation.z = -Math.PI / 2; tube.position.x = 0.8;
    barrel.add(tube); barrel.position.set(0, 1.0, 0); carriage.add(barrel);
    const plat = mesh(new THREE.CylinderGeometry(1.4, 1.6, 1, 24), std(0x9ca3af)); plat.position.y = -0.5; carriage.add(plat);
    ctx.scene.add(carriage);
    ball = mesh(new THREE.SphereGeometry(0.25, 20, 14), MAT.black); ctx.scene.add(ball);
    ghost = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.6, gapSize: 0.4, transparent: true, opacity: 0.7 }));
    ctx.scene.add(ghost);
    flag = new THREE.Group(); const pole = mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5, 6), MAT.white); pole.position.y = 1.25; const cloth = mesh(new THREE.PlaneGeometry(0.9, 0.55), std(0xef4444, { side: THREE.DoubleSide })); cloth.position.set(0.45, 2.2, 0); flag.add(pole, cloth); ctx.scene.add(flag);
    for (let x = 20; x <= 120; x += 20) { const m = mesh(new THREE.BoxGeometry(0.15, 0.02, 2), MAT.white, false); m.position.set(x, 0.01, 0); ctx.scene.add(m); ctx.label(`${x} m`, () => V3(x, 0.3, 1.4)); }
    velA = ctx.arrow(0xf59e0b, { radius: 0.06, head: 0.5 }); ctx.scene.add(velA);
    ctx.hTag = ctx.label('', () => (maxH ? maxH.p : null), 'big');
    ctx.rTag = ctx.label('', () => (land ? land.clone().add(V3(0, 3, 0)) : null), 'big');
  },
  reset(ctx) { flying = false; maxH = null; land = null; pos = V3(0, 0, 0); aim(ctx); },
  onControl(ctx) { if (!flying) aim(ctx); },
  step(ctx, dt) {
    if (!flying) return;
    const g = ctx.v.g, k = ctx.v.drag ? 0.012 : 0; // drag coefficient per unit mass (quadratic)
    const sp = Math.hypot(vx, vy);
    vx += -k * sp * vx * dt; vy += (-g - k * sp * vy) * dt;
    pos.x += vx * dt; pos.y += vy * dt;
    ctx.ft += dt;
    if (!maxH || pos.y > maxH.y) maxH = { y: pos.y, p: pos.clone().add(V3(0, 1.2, 0)) };
    if (pos.y <= 0) { pos.y = 0; flying = false; land = pos.clone(); ctx.rTag.set(`landed at ${pos.x.toFixed(1)} m`); ctx.pause(); }
    ctx.sc = (ctx.sc || 0) + 1;
    if (ctx.sc % 8 === 0) { ctx.cur.push(pos); ctx.plot(ctx.ft, [pos.y, Math.hypot(vx, vy)]); }
  },
  frame(ctx) { ball.position.copy(flying || land ? pos : muzzle(ctx)); if (maxH) ctx.hTag.set(`max height ${maxH.y.toFixed(1)} m`); velA.set(ball.position, V3(vx || 0, vy || 0, 0), flying ? 0.15 : 0); },
  ui(ctx) {
    const R = predict(ctx);
    ctx.readout('t', `${(ctx.ft || 0).toFixed(2)} s`); ctx.readout('x', `${pos.x.toFixed(1)} m`); ctx.readout('y', `${pos.y.toFixed(1)} m`); ctx.readout('v', `${flying ? Math.hypot(vx, vy).toFixed(1) : '0.0'} m/s`);
    ctx.readout('R', `${R.R.toFixed(1)} m${ctx.v.drag ? ' (no drag)' : ''}`); ctx.readout('H', `${R.H.toFixed(1)} m`);
  },
});
function muzzle(ctx) { const a = ctx.v.ang * Math.PI / 180; return V3(Math.cos(a) * 1.9, ctx.v.h0 + 1.0 + Math.sin(a) * 1.9, 0); }
function aim(ctx) {
  const a = ctx.v.ang * Math.PI / 180;
  carriage.position.y = ctx.v.h0; barrel.rotation.z = a;
  carriage.children[carriage.children.length - 1].scale.y = Math.max(0.01, ctx.v.h0 + 0.01); carriage.children[carriage.children.length - 1].position.y = -ctx.v.h0 / 2;
  // ideal (drag-free) path preview
  const m = muzzle(ctx), pts = [];
  const v0 = ctx.v.v0, g = ctx.v.g;
  for (let t = 0; t < 20; t += 0.05) { const y = m.y + v0 * Math.sin(a) * t - 0.5 * g * t * t; pts.push(V3(m.x + v0 * Math.cos(a) * t, Math.max(0, y), 0)); if (y < 0) break; }
  ghost.geometry.dispose(); ghost.geometry = new THREE.BufferGeometry().setFromPoints(pts); ghost.computeLineDistances();
  flag.position.set(predict(ctx).R, 0, -1.5);
  ball.position.copy(m);
}
function predict(ctx) { const a = ctx.v.ang * Math.PI / 180, v0 = ctx.v.v0, g = ctx.v.g, h = ctx.v.h0 + 1 + Math.sin(a) * 1.9; const vy0 = v0 * Math.sin(a); const t = (vy0 + Math.sqrt(vy0 * vy0 + 2 * g * h)) / g; return { R: Math.cos(a) * 1.9 + v0 * Math.cos(a) * t, H: h + vy0 * vy0 / (2 * g) }; }
function fire(ctx) {
  aim(ctx);
  const a = ctx.v.ang * Math.PI / 180;
  pos = muzzle(ctx); vx = ctx.v.v0 * Math.cos(a); vy = ctx.v.v0 * Math.sin(a); vz = 0;
  flying = true; maxH = null; land = null; ctx.ft = 0; ctx.rTag.set('');
  ctx.cur = ctx.trail([0x22d3ee, 0xf472b6, 0xa3e635, 0xfbbf24, 0xc084fc][ctx.trails.length % 5], 2000);
  ctx.scene.add(ctx.cur); ctx.trails.push(ctx.cur);
  ctx.clearGraph(); ctx.play();
}
</script>
</body></html>
