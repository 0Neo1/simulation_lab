<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Coulomb's Law</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// Two charged spheres on insulating stands. Drag the right sphere (or use the slider) to
// change the separation. Units: 1 scene unit = 1 cm.
const K = 8.99e9, Y = 14;
let s1, s2, a12, a21, lines, halo1, halo2;
function sphere() {
  const g = new THREE.Group();
  const ball = mesh(new THREE.SphereGeometry(2.2, 40, 28), MAT.steel);
  const rod = mesh(new THREE.CylinderGeometry(0.4, 0.4, Y - 2, 16), new THREE.MeshPhysicalMaterial({ color: 0xf3e9c6, roughness: 0.2, clearcoat: 1 })); rod.position.y = -(Y - 2) / 2 - 1;
  const base = mesh(new THREE.CylinderGeometry(3.5, 4, 1.2, 32), MAT.darkSteel); base.position.y = -Y + 0.6;
  g.add(ball, rod, base); g.ball = ball; g.userData.pickId = 'q2';
  return g;
}
const colOf = (q) => (q > 0 ? 0xef4444 : q < 0 ? 0x3b82f6 : 0x9ca3af);
runSim({
  title: "Coulomb's Law", subtitle: 'Electric force grows with the charges and falls off as the square of the distance.',
  stage: 'studio', camera: { pos: [0, 22, 50], target: [0, 10, 0] }, stageOpts: { floorSize: 45, gridDiv: 45 },
  hint: 'drag the right-hand sphere',
  controls: [
    { id: 'q1', label: 'Charge q₁', min: -50, max: 50, step: 1, value: 20, unit: 'nC' },
    { id: 'q2', label: 'Charge q₂', min: -50, max: 50, step: 1, value: -30, unit: 'nC' },
    { id: 'r', label: 'Separation r', min: 6, max: 40, step: 0.1, value: 16, unit: 'cm' },
    { id: 'lines', label: 'Show field lines', type: 'check', value: true },
  ],
  readouts: [{ id: 'F', label: 'Force magnitude' }, { id: 'kind', label: 'Type' }, { id: 'r', label: 'Distance r' }, { id: 'F2', label: 'Force at 2r' }, { id: 'E', label: 'Field of q₁ at q₂' }, { id: 'U', label: 'Potential energy' }],
  graph: { title: 'Force against distance', series: [{ name: '|F| (mN)', color: '#fbbf24' }], xlabel: 'r (cm)', ymin: 0, max: 400 },
  graphOverlay(ctx, g, { X, Y: Yf }) { const F = force(ctx) * 1000; g.fillStyle = '#f472b6'; g.beginPath(); g.arc(X(ctx.v.r), Yf(Math.abs(F)), 4.5, 0, 7); g.fill(); },
  info: 'Like charges repel and unlike charges attract. The force acts along the line joining the charges, and by Newton\'s third law each sphere feels the same size of force in opposite directions (the two arrows are always equal). Double the distance and the force drops to a quarter; double one charge and the force doubles.',
  formulas: ['F = k q₁ q₂ / r²', 'k = 1 / (4πε₀) = 8.99 × 10⁹ N·m²/C²'],
  dragPlaneNormal: [0, 0, 1],
  pickables: () => [s2],
  onDrag(ctx, id, p) { ctx.setControl('r', Math.max(6, Math.min(40, 2 * p.x))); },
  setup(ctx) {
    s1 = sphere(); s2 = sphere(); ctx.scene.add(s1, s2);
    halo1 = ctx.glowSprite(0xef4444, 9); halo2 = ctx.glowSprite(0x3b82f6, 9); ctx.scene.add(halo1, halo2);
    a12 = ctx.arrow(0xfbbf24, { radius: 0.3, head: 1.6 }); a21 = ctx.arrow(0xfbbf24, { radius: 0.3, head: 1.6 }); ctx.scene.add(a12, a21);
    lines = new THREE.Group(); ctx.scene.add(lines);
    ctx.label('q₁', () => s1.position.clone().add(V3(0, 4, 0))); ctx.label('q₂', () => s2.position.clone().add(V3(0, 4, 0)));
    ctx.fTag = ctx.label('F', () => (a21.visible ? s2.position.clone().add(V3(0, -4, 0)) : null));
    ctx.lastKey = '';
  },
  frame(ctx) {
    const r = ctx.v.r, x1 = -r / 2, x2 = r / 2, { q1, q2 } = ctx.v;
    s1.position.set(x1, Y, 0); s2.position.set(x2, Y, 0);
    halo1.position.copy(s1.position); halo2.position.copy(s2.position);
    halo1.material.color.setHex(colOf(q1)); halo2.material.color.setHex(colOf(q2));
    halo1.scale.setScalar(4 + Math.abs(q1) / 5); halo2.scale.setScalar(4 + Math.abs(q2) / 5);
    s1.ball.material = s2.ball.material = MAT.steel;
    const F = force(ctx), L = Math.min(14, 4 * Math.log10(1 + Math.abs(F) * 1e5)) * Math.sign(F); // log length so it stays visible
    // F > 0 = repulsion: q₂ pushed to +x, q₁ to −x
    a21.set(V3(x2 + 2.4 * Math.sign(L || 1), Y, 0), V3(L, 0, 0), 1);
    a12.set(V3(x1 - 2.4 * Math.sign(L || 1), Y, 0), V3(-L, 0, 0), 1);
    ctx.fTag.set(`F = ${(Math.abs(F) * 1000).toFixed(2)} mN`);
    const key = [q1, q2, r, ctx.v.lines].join();
    if (key !== ctx.lastKey) { ctx.lastKey = key; drawLines(ctx, x1, x2); plotCurve(ctx); }
  },
  ui(ctx) {
    const F = force(ctx), r = ctx.v.r / 100;
    ctx.readout('F', `${(Math.abs(F) * 1000).toFixed(3)} mN`); ctx.readout('kind', F > 0 ? 'Repulsive' : F < 0 ? 'Attractive' : 'None');
    ctx.readout('r', `${ctx.v.r.toFixed(1)} cm`); ctx.readout('F2', `${(Math.abs(F) * 250).toFixed(3)} mN`);
    ctx.readout('E', `${(K * Math.abs(ctx.v.q1) * 1e-9 / r / r / 1000).toFixed(1)} kN/C`);
    ctx.readout('U', `${(K * ctx.v.q1 * ctx.v.q2 * 1e-18 / r * 1000).toFixed(3)} mJ`);
  },
});
function force(ctx) { const r = ctx.v.r / 100; return K * ctx.v.q1 * 1e-9 * ctx.v.q2 * 1e-9 / (r * r); }
function plotCurve(ctx) { ctx.clearGraph(); for (let r = 6; r <= 40; r += 0.25) ctx.plot(r, [Math.abs(K * ctx.v.q1 * ctx.v.q2 * 1e-18 / (r / 100) ** 2) * 1000]); }
// Field lines traced in the x–y plane through the charges and rotated around the axis
function drawLines(ctx, x1, x2) {
  lines.clear();
  if (!ctx.v.lines) return;
  const Q = [[x1, ctx.v.q1], [x2, ctx.v.q2]];
  const E = (p) => { let ex = 0, ey = 0; for (const [x, q] of Q) { const dx = p.x - x, dy = p.y, r3 = Math.pow(dx * dx + dy * dy, 1.5) + 1e-6; ex += q * dx / r3; ey += q * dy / r3; } return [ex, ey]; };
  const mat = new THREE.LineBasicMaterial({ color: 0xfde68a, transparent: true, opacity: 0.55 });
  const sources = Q.filter(([, q]) => q !== 0);
  for (const [xs, qs] of sources) {
    const n = Math.round(4 + Math.abs(qs) / 5);
    for (let i = 0; i < n; i++) {
      const a = ((i + 0.5) / n) * Math.PI, sgn = Math.sign(qs);
      let p = { x: xs + Math.cos(a) * 2.4, y: Math.sin(a) * 2.4 }; const pts = [];
      for (let s = 0; s < 400; s++) {
        pts.push(p); const [ex, ey] = E(p), m = Math.hypot(ex, ey) || 1;
        p = { x: p.x + sgn * ex / m * 0.35, y: p.y + sgn * ey / m * 0.35 };
        if (Q.some(([x]) => Math.hypot(p.x - x, p.y) < 2.2) || Math.hypot(p.x, p.y) > 30 || p.y < 0) break;
      }
      // skip lines from the negative charge that duplicate those ending on it
      if (sgn < 0 && sources.length === 2 && Math.sign(Q[0][1]) !== Math.sign(Q[1][1])) continue;
      for (let k = 0; k < 6; k++) {
        const rot = (k * Math.PI) / 3;
        lines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map((q) => V3(q.x, Y + q.y * Math.cos(rot), q.y * Math.sin(rot)))), mat));
      }
    }
  }
}
</script>
</body></html>
