<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spring Energy</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// Horizontal spring–mass oscillator on an air track (cm on the bench, SI physics)
const X0 = 0, TRACK_Y = 4;
let x, v, block, spr, bars = {}, velArrow, fArrow;
runSim({
  title: 'Spring Energy', subtitle: 'Elastic potential energy and kinetic energy trade places; their sum stays fixed.',
  stage: 'bench', camera: { pos: [30, 55, 120], target: [0, 12, -5] },
  controls: [
    { id: 'k', label: 'Spring constant k', min: 5, max: 100, step: 1, value: 30, unit: 'N/m', reset: true },
    { id: 'm', label: 'Mass', min: 0.1, max: 2, step: 0.05, value: 0.5, unit: 'kg', reset: true },
    { id: 'A', label: 'Amplitude', min: 2, max: 20, step: 0.5, value: 12, unit: 'cm', reset: true },
    { id: 'mu', label: 'Friction (damping)', min: 0, max: 0.6, step: 0.01, value: 0, unit: '1/s' },
  ],
  readouts: [{ id: 'x', label: 'Displacement x' }, { id: 'v', label: 'Velocity' }, { id: 'KE', label: 'KE = ½mv²' }, { id: 'PE', label: 'PE = ½kx²' }, { id: 'E', label: 'Total energy' }, { id: 'T', label: 'T = 2π√(m/k)' }],
  graph: { title: 'Energy vs time', series: [{ name: 'KE (mJ)', color: '#f59e0b' }, { name: 'PE (mJ)', color: '#a78bfa' }, { name: 'Total (mJ)', color: '#22c55e' }], max: 700 },
  info: 'Pull the block to the amplitude and let go. At the ends it stops for an instant, so all the energy is stored in the stretched or squashed spring. Through the centre the spring is relaxed and all the energy is kinetic. Without friction the total stays constant; with friction it drains away as heat.',
  formulas: ['PE = ½ k x²', 'KE = ½ m v²', 'E = ½ k A²'],
  formulasPlain: ['PE = ½ k x²', 'KE = ½ m v²', 'T = 2π √(m/k)'],
  setup(ctx) {
    const track = mesh(new THREE.BoxGeometry(110, 3, 8), MAT.steel); track.position.set(0, -1.5, 0);
    const wall = mesh(new THREE.BoxGeometry(4, 22, 12), MAT.darkWood); wall.position.set(-55, 8, 0);
    const ruler = mesh(new THREE.BoxGeometry(100, 0.3, 5), new THREE.MeshStandardMaterial({ map: ctx.canvasTex(1024, 48, (g, w, h) => { g.fillStyle = '#f5edd0'; g.fillRect(0, 0, w, h); g.fillStyle = '#222'; g.font = '16px Arial'; g.textAlign = 'center'; for (let c = -25; c <= 25; c++) { const px = (c + 25) / 50 * (w - 20) + 10; g.fillRect(px - 1, 0, 2, c % 5 ? 12 : 22); if (c % 5 === 0) g.fillText(String(c), px, 40); } }) }));
    ruler.position.set(0, -2.8, 7);
    ctx.scene.add(track, wall, ruler);
    block = mesh(new THREE.BoxGeometry(10, 8, 9), std(0x2563eb, { metalness: 0.2 }));
    spr = ctx.spring(0xb8bec5, { r: 2.2, turns: 16, wire: 0.3 });
    ctx.scene.add(block, spr);
    // 3D energy bars behind the track
    const base = mesh(new THREE.BoxGeometry(36, 1, 10), MAT.darkSteel); base.position.set(0, -2.5, -32); ctx.scene.add(base);
    [['KE', 0xf59e0b, -12], ['PE', 0xa78bfa, 0], ['E', 0x22c55e, 12]].forEach(([k, c, dx]) => {
      const b = mesh(new THREE.BoxGeometry(7, 1, 7), std(c, { emissive: c, emissiveIntensity: 0.15 })); b.geometry.translate(0, 0.5, 0); b.position.set(dx, -2, -32); ctx.scene.add(b); bars[k] = b;
      ctx.label(k === 'E' ? 'Total' : k, () => V3(dx, b.scale.y - 1, -32));
    });
    velArrow = ctx.arrow(0xf59e0b, { radius: 0.35, head: 2.4 }); fArrow = ctx.arrow(0xef4444, { radius: 0.35, head: 2.4 });
    ctx.scene.add(velArrow, fArrow);
    ctx.label('spring force', () => fArrow.visible ? block.position.clone().add(V3(0, -2, 9)) : null);
    ctx.label('velocity', () => velArrow.visible ? block.position.clone().add(V3(0, 12, 0)) : null);
  },
  reset(ctx) { x = ctx.v.A / 100; v = 0; place(ctx); },
  step(ctx, dt) {
    // velocity Verlet keeps the total energy flat when there is no friction
    const acc = (xx, vv) => (-ctx.v.k * xx) / ctx.v.m - ctx.v.mu * vv;
    const a0 = acc(x, v); x += v * dt + 0.5 * a0 * dt * dt;
    const a1 = acc(x, v + a0 * dt); v += 0.5 * (a0 + a1) * dt;
    ctx.n = (ctx.n || 0) + 1;
    if (ctx.n % 10 === 0) { const e = en(ctx); ctx.plot(ctx.t, [e.KE * 1000, e.PE * 1000, (e.KE + e.PE) * 1000]); }
  },
  frame(ctx) { place(ctx); },
  ui(ctx) {
    const e = en(ctx);
    ctx.readout('x', `${(x * 100).toFixed(1)} cm`); ctx.readout('v', `${v.toFixed(3)} m/s`);
    ctx.readout('KE', `${(e.KE * 1000).toFixed(1)} mJ`); ctx.readout('PE', `${(e.PE * 1000).toFixed(1)} mJ`);
    ctx.readout('E', `${((e.KE + e.PE) * 1000).toFixed(1)} mJ`); ctx.readout('T', `${(2 * Math.PI * Math.sqrt(ctx.v.m / ctx.v.k)).toFixed(3)} s`);
  },
});
function en(ctx) { return { KE: 0.5 * ctx.v.m * v * v, PE: 0.5 * ctx.v.k * x * x }; }
function place(ctx) {
  const px = X0 + x * 100;
  block.position.set(px, TRACK_Y, 0);
  block.scale.setScalar(Math.cbrt(ctx.v.m / 0.5) * 0.9 + 0.1);
  spr.set(V3(-53, TRACK_Y, 0), V3(px - 5 * block.scale.x, TRACK_Y, 0));
  const e = en(ctx), Emax = 0.5 * ctx.v.k * (ctx.v.A / 100) ** 2 || 1, H = 40;
  bars.KE.scale.y = Math.max(0.05, (e.KE / Emax) * H); bars.PE.scale.y = Math.max(0.05, (e.PE / Emax) * H); bars.E.scale.y = Math.max(0.05, ((e.KE + e.PE) / Emax) * H);
  velArrow.set(block.position.clone().add(V3(0, 7, 0)), V3(v, 0, 0), 40);
  fArrow.set(block.position.clone().add(V3(0, -3, 6)), V3(-ctx.v.k * x, 0, 0), 4);
}
</script>
</body></html>
