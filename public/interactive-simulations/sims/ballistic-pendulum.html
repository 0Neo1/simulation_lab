<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ballistic Pendulum</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// A wooden block hung on two strings; a pellet embeds in it and it swings up.
const PIV = V3(10, 100, 0);
let hScale, gunStand, block, strings, bullet, gun, tr, phase, bx, theta, omega, maxTheta, Vafter, hMark;
runSim({
  title: 'Ballistic Pendulum', subtitle: 'Momentum is conserved in the impact, then energy is conserved in the swing.',
  stage: 'bench', camera: { pos: [-20, 70, 150], target: [0, 55, 0] },
  controls: [
    { id: 'm', label: 'Pellet mass m', min: 2, max: 30, step: 1, value: 10, unit: 'g', reset: true },
    { id: 'M', label: 'Block mass M', min: 0.5, max: 5, step: 0.1, value: 1.5, unit: 'kg', reset: true },
    { id: 'u', label: 'Pellet speed', min: 50, max: 400, step: 5, value: 200, unit: 'm/s', reset: true },
    { id: 'L', label: 'String length', min: 30, max: 80, step: 1, value: 60, unit: 'cm', reset: true },
  ],
  buttons: [{ id: 'fire', label: '🔫 Fire', kind: 'warn', run: (c) => { if (phase === 'ready') { phase = 'fly'; c.play(); } } }],
  readouts: [{ id: 'V', label: 'Speed after impact V' }, { id: 'h', label: 'Rise height h' }, { id: 'ang', label: 'Max swing angle' }, { id: 'u', label: 'u from h (inferred)' }, { id: 'ke', label: 'KE kept in impact' }, { id: 'ph', label: 'Stage' }],
  info: 'The pellet stops inside the block in a tiny fraction of a second, too quickly for the strings to act, so momentum is conserved: mu = (m + M)V. Most of the kinetic energy turns into heat and deformation. After the impact the block swings up and its kinetic energy becomes potential energy, ½(m + M)V² = (m + M)gh. Measuring h lets you work out the pellet speed. The pellet is shown in slow motion.',
  formulas: ['m u = (m + M) V', 'V = √(2 g h)', 'u = ((m + M) / m) √(2 g h)'],
  formulasPlain: ['mu = (m + M)V', 'V = √(2gh)', 'u = ((m+M)/m)√(2gh)'],
  setup(ctx) {
    const frame = new THREE.Group();
    [-18, 18].forEach((z) => { const p = mesh(new THREE.CylinderGeometry(1, 1, 104, 12), MAT.steel); p.position.set(50, 49, z); frame.add(p); const f = mesh(new THREE.BoxGeometry(12, 2, 6), MAT.darkSteel); f.position.set(50, -2, z); frame.add(f); });
    const top = mesh(new THREE.BoxGeometry(46, 2.5, 40), MAT.darkSteel); top.position.set(28, 101, 0); frame.add(top);
    const scale = mesh(new THREE.PlaneGeometry(50, 60), new THREE.MeshStandardMaterial({ map: ctx.canvasTex(256, 300, (g, w, h) => { g.fillStyle = '#f7f3e6'; g.fillRect(0, 0, w, h); g.strokeStyle = '#333'; g.fillStyle = '#333'; g.font = '14px Arial'; for (let i = 0; i <= 30; i++) { const y = h - i * 10 - 4; g.lineWidth = i % 5 ? 1 : 2; g.beginPath(); g.moveTo(w - (i % 5 ? 20 : 40), y); g.lineTo(w, y); g.stroke(); if (i % 5 === 0) g.fillText(`${i} cm`, w - 90, y + 5); } }), side: THREE.DoubleSide }));
    scale.position.set(PIV.x + 22, 40, -12); hScale = scale; frame.add(scale);
    ctx.scene.add(frame);
    block = mesh(new THREE.BoxGeometry(12, 10, 10), MAT.wood);
    const lineMat = new THREE.LineBasicMaterial({ color: 0xeeeeee });
    strings = [-4, 4].map((z) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(), V3()]), lineMat); l.userData.z = z; return l; });
    gun = new THREE.Group();
    const barrel = mesh(new THREE.CylinderGeometry(1, 1.2, 30, 16), MAT.darkSteel); barrel.rotation.z = Math.PI / 2;
    const stock = mesh(new THREE.BoxGeometry(16, 5, 4), MAT.darkWood); stock.position.set(-20, -2, 0);
    const stand = gunStand = mesh(new THREE.BoxGeometry(5, 1, 5), MAT.darkSteel); stand.geometry.translate(0, -0.5, 0); stand.position.set(-8, -1, 0);
    gun.add(barrel, stock, stand); gun.position.set(-70, 0, 0);
    bullet = mesh(new THREE.CapsuleGeometry(0.5, 1.4, 4, 8), MAT.copper); bullet.rotation.z = Math.PI / 2;
    hMark = mesh(new THREE.BoxGeometry(22, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    tr = ctx.trail(0xfbbf24, 400);
    ctx.scene.add(block, ...strings, gun, bullet, hMark, tr);
    ctx.label('M', () => block.position.clone().add(V3(0, 8, 0)));
    ctx.label('h', () => hMark.visible ? hMark.position.clone().add(V3(14, 2, 0)) : null);
  },
  reset(ctx) {
    phase = 'ready'; theta = 0; omega = 0; maxTheta = 0; Vafter = 0; tr.clear();
    const y = PIV.y - ctx.v.L; gun.position.y = y; gunStand.scale.y = y + 2; hScale.position.y = y + 29.2; bx = -55; hMark.visible = false; place(ctx);
  },
  step(ctx, dt) {
    const L = ctx.v.L / 100, g = 9.8;
    if (phase === 'fly') {
      bx += 180 * dt; // slow-motion pellet (cm per s on screen)
      if (bx >= PIV.x - 6) { phase = 'swing'; const m = ctx.v.m / 1000; Vafter = (m * ctx.v.u) / (m + ctx.v.M); omega = Vafter / L; }
    } else if (phase === 'swing') {
      omega += -(g / L) * Math.sin(theta) * dt; theta += omega * dt;
      if (theta > maxTheta) maxTheta = theta;
      ctx.n = (ctx.n || 0) + 1; if (ctx.n % 6 === 0) tr.push(block.position);
    }
  },
  frame(ctx) { place(ctx); },
  ui(ctx) {
    const L = ctx.v.L / 100, m = ctx.v.m / 1000, h = L * (1 - Math.cos(maxTheta));
    ctx.readout('V', phase === 'swing' ? `${Vafter.toFixed(3)} m/s` : '—');
    ctx.readout('h', phase === 'swing' ? `${(h * 100).toFixed(2)} cm` : '—');
    ctx.readout('ang', phase === 'swing' ? `${(maxTheta * 180 / Math.PI).toFixed(1)}°` : '—');
    ctx.readout('u', phase === 'swing' && h > 0 ? `${(((m + ctx.v.M) / m) * Math.sqrt(2 * 9.8 * h)).toFixed(1)} m/s` : '—');
    ctx.readout('ke', phase === 'swing' ? `${((m / (m + ctx.v.M)) * 100).toFixed(2)} %` : '—');
    ctx.readout('ph', { ready: 'Ready — press Fire', fly: 'Pellet in flight', swing: 'Swinging' }[phase]);
    if (phase === 'swing' && maxTheta > 0.01) { hMark.visible = true; hMark.position.set(PIV.x, PIV.y - ctx.v.L * Math.cos(maxTheta), 6); }
  },
});
function place(ctx) {
  const L = ctx.v.L, s = Math.cbrt(ctx.v.M / 1.5);
  const c = PIV.clone().add(V3(Math.sin(theta) * L, -Math.cos(theta) * L, 0));
  block.position.copy(c); block.rotation.z = theta; block.scale.setScalar(s);
  strings.forEach((l) => { const z = l.userData.z * s; l.geometry.setFromPoints([V3(PIV.x, PIV.y, z * 2.5), c.clone().add(V3(-Math.sin(theta) * -5 * s, Math.cos(theta) * 5 * s, z))]); });
  if (phase === 'swing') bullet.position.copy(c).add(V3(Math.cos(theta) * -4 * s, Math.sin(theta) * -4 * s, 0));
  else bullet.position.set(bx, PIV.y - L, 0);
  bullet.rotation.z = Math.PI / 2 + (phase === 'swing' ? theta : 0);
}
</script>
</body></html>
