<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inclined Plane & Friction</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// A block on an adjustable wooden ramp on the bench (cm). Physics in SI.
const LEN = 120;
let ramp, block, s, v, state, aG, aN, aF, aW, pivot;
runSim({
  title: 'Inclined Plane & Friction', subtitle: 'Slide a block down a ramp — change the angle and the friction and see the forces.',
  stage: 'bench', camera: { pos: [20, 70, 150], target: [0, 20, -5] },
  controls: [
    { id: 'ang', label: 'Ramp angle', min: 0, max: 60, step: 0.5, value: 25, unit: '°', reset: true },
    { id: 'mus', label: 'Static friction μs', min: 0, max: 1, step: 0.01, value: 0.4 },
    { id: 'muk', label: 'Kinetic friction μk', min: 0, max: 1, step: 0.01, value: 0.3 },
    { id: 'm', label: 'Block mass', min: 0.2, max: 5, step: 0.1, value: 1, unit: 'kg' },
    { id: 'push', label: 'Give it a push', type: 'check', value: false, reset: true },
  ],
  readouts: [{ id: 'st', label: 'State' }, { id: 'a', label: 'Acceleration' }, { id: 'v', label: 'Speed' }, { id: 's', label: 'Distance' }, { id: 'fp', label: 'Weight along slope' }, { id: 'ff', label: 'Friction' }],
  graph: { title: 'Speed and distance', series: [{ name: 'v (m/s)', color: '#f59e0b' }, { name: 's (m)', color: '#22d3ee' }], max: 700 },
  info: 'The weight mg splits into mg sin θ down the slope and mg cos θ into the surface (balanced by the normal force N). Static friction can hold the block up to μs·N; once it slides, kinetic friction μk·N opposes the motion. The block starts to slide when tan θ exceeds μs.',
  formulas: ['a = g (sin θ − μk cos θ)', 'slides when tan θ > μs', 'N = m g cos θ'],
  setup(ctx) {
    pivot = new THREE.Group(); pivot.position.set(LEN / 2 - 10, -3, -5); ctx.scene.add(pivot);
    ramp = new THREE.Group(); pivot.add(ramp);
    const plank = mesh(new THREE.BoxGeometry(LEN, 2.5, 22), std(0xb07d4f, { roughness: 0.6 })); plank.position.set(-LEN / 2, 1.25, 0); ramp.add(plank);
    const edge = mesh(new THREE.BoxGeometry(LEN, 1, 1), MAT.darkWood); edge.position.set(-LEN / 2, 3, 11); ramp.add(edge);
    ctx.support = mesh(new THREE.BoxGeometry(6, 1, 18), MAT.darkSteel); ctx.scene.add(ctx.support);
    block = mesh(new THREE.BoxGeometry(12, 8, 12), std(0x7c3aed, { roughness: 0.5 })); ctx.scene.add(block);
    const hinge = mesh(new THREE.CylinderGeometry(1.2, 1.2, 24, 12), MAT.steel); hinge.rotation.x = Math.PI / 2; hinge.position.set(LEN / 2 - 10, -2, -5); ctx.scene.add(hinge);
    const mk = (c) => ctx.arrow(c, { radius: 0.5, head: 3 });
    aW = mk(0xef4444); aN = mk(0x22c55e); aF = mk(0xf59e0b); aG = mk(0xfb7185);
    ctx.scene.add(aW, aN, aF, aG);
    ctx.label('mg', () => block.position.clone().add(V3(2, -24, 8)));
    ctx.label('N', () => block.position.clone().add(nrm().multiplyScalar(26)).add(V3(0, 0, 8)));
    ctx.label('friction', () => (aF.visible ? block.position.clone().add(dn().multiplyScalar(-24)).add(V3(0, 4, 8)) : null));
    ctx.label('mg sin θ', () => block.position.clone().add(dn().multiplyScalar(22)).add(V3(0, -3, 8)));
  },
  reset(ctx) { s = 0.05; v = ctx.v.push ? 0.6 : 0; state = 'at rest'; tilt(ctx); place(ctx); },
  onControl(ctx) { tilt(ctx); },
  step(ctx, dt) {
    const th = ctx.v.ang * Math.PI / 180, g = 9.8;
    const drive = g * Math.sin(th), Nn = g * Math.cos(th);
    if (v <= 1e-6) {
      if (Math.tan(th) > ctx.v.mus) { state = 'sliding'; v = 1e-5; } else { v = 0; state = 'held by static friction'; ctx.acc = 0; }
    }
    if (v > 0) { const a = drive - ctx.v.muk * Nn; ctx.acc = a; v = Math.max(0, v + a * dt); s += v * dt; state = v > 0 ? 'sliding' : 'stopped'; }
    if (s >= (LEN - 14) / 100) { s = (LEN - 14) / 100; v = 0; state = 'reached the bottom'; ctx.pause(); }
    ctx.sc = (ctx.sc || 0) + 1; if (ctx.sc % 12 === 0) ctx.plot(ctx.t, [v, s]);
  },
  frame(ctx) { place(ctx); },
  ui(ctx) {
    const th = ctx.v.ang * Math.PI / 180, m = ctx.v.m, g = 9.8;
    ctx.readout('st', state); ctx.readout('a', `${(ctx.acc || 0).toFixed(2)} m/s²`); ctx.readout('v', `${v.toFixed(2)} m/s`); ctx.readout('s', `${s.toFixed(2)} m`);
    ctx.readout('fp', `${(m * g * Math.sin(th)).toFixed(2)} N`);
    ctx.readout('ff', `${(v > 0 ? ctx.v.muk * m * g * Math.cos(th) : Math.min(m * g * Math.sin(th), ctx.v.mus * m * g * Math.cos(th))).toFixed(2)} N`);
  },
});
const dn = () => V3(-Math.cos(pivot.userData.th), -Math.sin(pivot.userData.th), 0); // down the slope
const nrm = () => V3(-Math.sin(pivot.userData.th), Math.cos(pivot.userData.th), 0);
function tilt(ctx) {
  const th = ctx.v.ang * Math.PI / 180;
  pivot.userData.th = th; ramp.rotation.z = -th;
  // the raised end rests on a support block
  const top = V3(-LEN * Math.cos(th), LEN * Math.sin(th), 0).add(pivot.position);
  ctx.support.scale.y = Math.max(0.1, top.y + 3); ctx.support.position.set(top.x + 3, (top.y - 3) / 2, -5);
}
function place(ctx) {
  const th = pivot.userData.th;
  const d = (LEN - 8) - s * 100; // distance from hinge along the plank
  const surf = pivot.position.clone().add(V3(-d * Math.cos(th), d * Math.sin(th), 0)).add(V3(Math.sin(th) * 2.5, Math.cos(th) * 2.5, 0));
  block.position.copy(surf).add(nrm().multiplyScalar(4)); block.rotation.z = -th;
  const m = ctx.v.m, g = 9.8, sc = 1.6 / Math.max(1, m);
  const o = block.position.clone().add(V3(0, 0, 8));
  aW.set(o, V3(0, -m * g, 0), sc); aN.set(o, nrm().multiplyScalar(m * g * Math.cos(th)), sc);
  const fr = v > 0 ? ctx.v.muk * m * g * Math.cos(th) : Math.min(m * g * Math.sin(th), ctx.v.mus * m * g * Math.cos(th));
  aF.set(o, dn().multiplyScalar(-fr), sc); aG.set(o, dn().multiplyScalar(m * g * Math.sin(th)), sc);
}
</script>
</body></html>
