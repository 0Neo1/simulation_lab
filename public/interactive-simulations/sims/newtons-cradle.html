<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newton's Cradle</title>
<link rel="stylesheet" href="../engine/concept.css">
<script type="importmap">{"imports":{"three":"../../simulations/lib/three/three.module.min.js","three/addons/":"../../simulations/lib/three/addons/"}}</script>
</head><body>
<script type="module">
import { runSim, V3, MAT, mesh, std, THREE } from '../engine/concept.js';
// Five steel balls on bifilar strings (cm on the lab bench). Collisions resolved as a chain of elastic impacts.
const N = 5, R = 2.5, L = 22, TOP = 40;
let balls, th, w, strings;
runSim({
  title: "Newton's Cradle", subtitle: 'Momentum and energy pass through the row of balls — lift one, and one flies out the other side.',
  stage: 'bench', camera: { pos: [30, 45, 70], target: [0, 22, -5] }, dt: 1 / 2000,
  controls: [
    { id: 'n', label: 'Balls lifted', min: 1, max: 4, step: 1, value: 1, reset: true },
    { id: 'a0', label: 'Lift angle', min: 5, max: 60, step: 1, value: 35, unit: '°', reset: true },
    { id: 'e', label: 'Restitution (elasticity)', min: 0.5, max: 1, step: 0.01, value: 0.98 },
    { id: 'both', label: 'Lift from both sides', type: 'check', value: false, reset: true },
  ],
  readouts: [{ id: 'p', label: 'Total momentum' }, { id: 'E', label: 'Total energy' }, { id: 'out', label: 'Balls moving' }],
  graph: { title: 'Kinetic + potential energy', series: [{ name: 'E total (mJ)', color: '#a78bfa' }, { name: 'KE (mJ)', color: '#f59e0b' }], max: 900 },
  info: 'When the swinging ball strikes the row, its momentum and kinetic energy travel through the touching balls and only the last one moves off. Conserving both momentum and kinetic energy forces the same number of balls to leave as arrived. With less than perfect elasticity the motion slowly spreads through the row and dies away.',
  formulas: ['m v₁ = m v₂  (momentum)', '½ m v₁² = ½ m v₂²  (energy)'],
  setup(ctx) {
    const frame = new THREE.Group(), chrome = MAT.steel;
    [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => { const p = mesh(new THREE.CylinderGeometry(0.6, 0.6, TOP + 3, 12), chrome); p.position.set(sx * 16, (TOP + 3) / 2 - 3, sz * 7 - 5); frame.add(p); }));
    [-1, 1].forEach((sz) => { const b = mesh(new THREE.CylinderGeometry(0.6, 0.6, 32, 12), chrome); b.rotation.z = Math.PI / 2; b.position.set(0, TOP, sz * 7 - 5); frame.add(b); });
    const base = mesh(new THREE.BoxGeometry(36, 2, 18), MAT.black); base.position.set(0, -2, -5); frame.add(base);
    ctx.scene.add(frame);
    balls = []; strings = [];
    for (let i = 0; i < N; i++) {
      const b = mesh(new THREE.SphereGeometry(R, 32, 20), new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 1, roughness: 0.08 })); ctx.scene.add(b); balls.push(b);
      const ss = [-1, 1].map(() => { const s = mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 4), MAT.white, false); ctx.scene.add(s); return s; }); strings.push(ss);
    }
  },
  reset(ctx) {
    th = new Array(N).fill(0); w = new Array(N).fill(0);
    const a = ctx.v.a0 * Math.PI / 180;
    for (let i = 0; i < ctx.v.n; i++) th[i] = -a;
    if (ctx.v.both) for (let i = 0; i < Math.min(ctx.v.n, N - ctx.v.n); i++) th[N - 1 - i] = a;
  },
  step(ctx, dt) {
    const g = 9.8, Lm = L / 100;
    for (let i = 0; i < N; i++) { w[i] += -(g / Lm) * Math.sin(th[i]) * dt; th[i] += w[i] * dt; }
    // contacts: neighbouring balls touching and approaching exchange velocity (elastic, equal masses)
    for (let pass = 0; pass < N; pass++) {
      for (let i = 0; i < N - 1; i++) {
        const xi = x(i), xj = x(i + 1);
        if (xj - xi <= 2 * R + 1e-3) {
          const vi = w[i] * Lm * Math.cos(th[i]), vj = w[i + 1] * Lm * Math.cos(th[i + 1]);
          if (vi > vj) {
            const e = ctx.v.e, vi2 = ((1 - e) * vi + (1 + e) * vj) / 2, vj2 = ((1 + e) * vi + (1 - e) * vj) / 2;
            w[i] = vi2 / (Lm * Math.cos(th[i])); w[i + 1] = vj2 / (Lm * Math.cos(th[i + 1]));
            if (Math.abs(vi - vj) > 0.05) ctx.click = true;
          }
          // no overlap
          const over = 2 * R - (xj - xi);
          if (over > 0) { th[i] = Math.asin(Math.max(-1, Math.min(1, (x(i) - over / 2 - (i - 2) * 2 * R) / L))); th[i + 1] = Math.asin(Math.max(-1, Math.min(1, (x(i + 1) + over / 2 - (i - 1) * 2 * R) / L))); }
        }
      }
    }
    ctx.sc = (ctx.sc || 0) + 1; if (ctx.sc % 40 === 0) { const e = energy(); ctx.plot(ctx.t, [e.E * 1000, e.KE * 1000]); }
  },
  frame(ctx) {
    for (let i = 0; i < N; i++) {
      const px = (i - 2) * 2 * R, piv = V3(px, TOP, -5);
      const p = piv.clone().add(V3(Math.sin(th[i]) * L, -Math.cos(th[i]) * L, 0));
      balls[i].position.copy(p);
      strings[i].forEach((s, k) => { const top = V3(px, TOP, -5 + (k ? 7 : -7)); s.position.copy(top).lerp(p, 0.5); s.scale.y = top.distanceTo(p); s.quaternion.setFromUnitVectors(V3(0, 1, 0), p.clone().sub(top).normalize()); });
    }
  },
  ui(ctx) { const e = energy(); ctx.readout('p', `${(momentum() * 1000).toFixed(1)} g·m/s`); ctx.readout('E', `${(e.E * 1000).toFixed(2)} mJ`); ctx.readout('out', String(w.filter((q) => Math.abs(q) > 0.3).length)); },
});
const MASS = 0.1;
function x(i) { return (i - 2) * 2 * R + Math.sin(th[i]) * L; }
function energy() { const Lm = L / 100; let KE = 0, PE = 0; for (let i = 0; i < N; i++) { KE += 0.5 * MASS * (w[i] * Lm) ** 2; PE += MASS * 9.8 * Lm * (1 - Math.cos(th[i])); } return { KE, E: KE + PE }; }
function momentum() { const Lm = L / 100; return w.reduce((s, q, i) => s + MASS * q * Lm * Math.cos(th[i]), 0); }
</script>
</body></html>
