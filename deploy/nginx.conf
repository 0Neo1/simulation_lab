# Throttle AI generation per client IP (this file is included in nginx's http context).
limit_req_zone $binary_remote_addr zone=zerolab_gen:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/zerolab;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Prompt Simulator backend: forwards to Gemini and injects the API key
    # server-side. The key and model live in /etc/nginx/zerolab/gemini.conf
    # (root-only, written by deploy.sh) and never reach the browser.
    location = /api/generate {
        limit_except POST { deny all; }
        limit_req zone=zerolab_gen burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        include /etc/nginx/zerolab/gemini.conf;
        if ($gemini_key = "") { return 503; }

        rewrite ^ /v1beta/models/$gemini_model:generateContent? break;
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header x-goog-api-key $gemini_key;
        proxy_set_header Content-Type application/json;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        return 404;
    }

    # Long-cache hashed build assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-contained HTML simulations: serve as-is
    location /simulations/ {
        try_files $uri $uri/ =404;
    }
    location /interactive-simulations/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
